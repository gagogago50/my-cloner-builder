name: Build uv Windows &amp; Security Scan

# ═══════════════════════════════════════════════════════════════════════════════
# Trigger: UNIQUEMENT manuel — aucun build automatique (pas de push/PR/release).
# ═══════════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag / branche / SHA a builder (ex: 0.6.5, main). "latest" = dernier tag stable detecte automatiquement.'
        type: string
        required: true
        default: 'latest'
      include_wheels:
        description: 'Inclure aussi les wheels PyPI dans les artifacts ?'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: uv
  MODULE_NAME: uv
  PYTHON_VERSION: "3.11"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"
  TARGET: x86_64-pc-windows-msvc

# ═══════════════════════════════════════════════════════════════════════════════
# Architecture des jobs (limite GitHub Free tier = 2 jobs concurrents) :
#
#   [build-windows]  ┐
#                   ├→  [summary]
#   [security]      ┘
#
#   - build-windows : 1 runner Windows, compile uv.exe/uvx.exe/uvw.exe
#   - security      : 1 runner Ubuntu, enchaine les 6 scans SEQUENTIELLEMENT
#                     (ClamAV → Semgrep → GuardDog → CodeQL → Gitleaks → Bearer)
#   - summary       : attend les deux, affiche le tableau final
# ═══════════════════════════════════════════════════════════════════════════════

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — BUILD uv x86_64-pc-windows-msvc (release, Rust stable)
  # Base sur la section "windows" de build-release-binaries.yml (lignes 244-321)
  # du repo astral-sh/uv.
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: "Build uv — x86_64-pc-windows-msvc"
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.resolve-ref.outputs.VERSION }}
    steps:

      # ── 0. Resoudre le ref (avant checkout) ────────────────────────────────
      - name: Resolve ref (latest -> dernier tag stable)
        id: resolve-ref
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ github.event.inputs.ref }}"

          echo "Input ref demande: $INPUT_REF"

          if [ "$INPUT_REF" = "latest" ]; then
            # Recupere le dernier tag vX.Y.Z (non prerelease) trie semantiquement
            RESOLVED=$(git ls-remote --tags --sort=-v:refname https://github.com/astral-sh/uv.git \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -v '\^{}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -1)
            if [ -z "$RESOLVED" ]; then
              echo "::error::Impossible de detecter le dernier tag"
              exit 1
            fi
            VERSION="$RESOLVED"
            echo "Dernier tag stable detecte: $VERSION"
          else
            RESOLVED="$INPUT_REF"
            # Nettoie un prefixe "v" eventuel pour la version
            VERSION="${INPUT_REF#v}"
            echo "Ref fournie par l'utilisateur: $INPUT_REF (version=$VERSION)"
          fi

          # IMPORTANT: utiliser "$GITHUB_OUTPUT" avec une ligne delimiter
          # pour eviter tout probleme de caracteres speciaux / encodage.
          {
            echo "resolved_ref=$RESOLVED"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # ── 1. Checkout du repo astral-sh/uv directement (pas de fork) ────────
      - name: Checkout astral-sh/uv
        uses: actions/checkout@v4
        with:
          repository: astral-sh/uv
          ref: ${{ steps.resolve-ref.outputs.resolved_ref }}
          fetch-depth: 0
          persist-credentials: false

      # ── 2. Toolchain Rust stable ──────────────────────────────────────────
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── 3. Python 3.11 (necessaire pour maturin/pyo3) ─────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      # ── 4. NASM (requis par aws-lc-sys sur x86_64 Windows) ────────────────
      - name: Install NASM
        run: |
          winget install NASM.NASM --accept-source-agreements --accept-package-agreements
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ── 5. cargo-auditable (necessite par scripts/cargo.cmd d'uv qui
      #       appelle "cargo auditable" au lieu de "cargo" brut) ─────────────
      - name: Install cargo-auditable
        shell: bash
        run: cargo install cargo-auditable --locked

      # ── 6. Prep README (transformation PyPI) ──────────────────────────────
      - name: Prep README.md
        shell: bash
        run: python scripts/transform_readme.py --target pypi

      # ── 7. BUILD RELEASE (identique a upstream) ───────────────────────────
      - name: Build uv (release)
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist --features self-update,windows-gui-bin --compatibility pypi
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.cmd
          AWS_LC_SYS_PREBUILT_NASM: "0"

      # ── 8. Verification des binaires produits ─────────────────────────────
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          echo ""
          echo "--- Binaires dans target/${TARGET}/release/ ---"
          ls -lh "target/${TARGET}/release/"*.exe 2>&1 || true
          echo ""
          for bin in uv.exe uvx.exe uvw.exe; do
            if [ -f "target/${TARGET}/release/$bin" ]; then
              SIZE=$(stat -c%s "target/${TARGET}/release/$bin" 2>/dev/null || stat -f%z "target/${TARGET}/release/$bin" 2>/dev/null)
              echo "OK  $bin  (${SIZE} octets)"
            else
              echo "::error::$bin INTROUVABLE - build probablement echoue"
              exit 1
            fi
          done
          echo ""
          echo "--- Version du binaire ---"
          "./target/${TARGET}/release/uv.exe" --version

      # ── 9. Smoke test rapide ──────────────────────────────────────────────
      - name: Smoke test
        shell: bash
        run: |
          "./target/${TARGET}/release/uv.exe" --version
          "./target/${TARGET}/release/uv.exe" pip compile --help > NUL
          "./target/${TARGET}/release/uvx.exe" --help > NUL
          "./target/${TARGET}/release/uvw.exe" --help > NUL
          echo "Smoke tests OK"

      # ── 10. Creation de l'archive ZIP standalone ──────────────────────────
      - name: Create standalone zip
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-ref.outputs.VERSION }}"
          STAGING="uv-${VERSION}-${TARGET}"
          ARCHIVE_FILE="${STAGING}.zip"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/uv.exe"  "$STAGING/uv.exe"
          cp "target/${TARGET}/release/uvx.exe" "$STAGING/uvx.exe"
          cp "target/${TARGET}/release/uvw.exe" "$STAGING/uvw.exe"
          {
            echo "uv ${VERSION} - standalone build for Windows x86_64 (MSVC)"
            echo "Source : https://github.com/astral-sh/uv  (ref ${{ steps.resolve-ref.outputs.resolved_ref }})"
            echo "Build  : $(date -u +'%Y-%m-%dT%H:%M:%SZ') via GitHub Actions"
            echo ""
            echo "Usage : placer uv.exe dans votre PATH. uvx.exe et uvw.exe sont"
            echo "        des alias complementaires (uvx = uv tool run, uvw = GUI sans console)."
          } > "$STAGING/README.txt"
          7z a "$ARCHIVE_FILE" "./$STAGING/"
          # Checksums SHA-256
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
          else
            # Windows: utiliser certutil pour calculer le hash
            certutil -hashfile "$ARCHIVE_FILE" SHA256 | findstr /v "SHA256" | tr -d ' \r\n' | awk -v f="$ARCHIVE_FILE" '{print $0 "  " f}' > "$ARCHIVE_FILE.sha256"
          fi
          echo ""
          echo "--- Archive produite ---"
          ls -lh "$ARCHIVE_FILE" "$ARCHIVE_FILE.sha256"
          echo ""
          cat "$ARCHIVE_FILE.sha256"
          echo "ARCHIVE_FILE=$ARCHIVE_FILE" >> "$GITHUB_ENV"

      # ── 11. Upload archive standalone ─────────────────────────────────────
      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: uv-windows-standalone-${{ steps.resolve-ref.outputs.VERSION }}
          path: |
            *.zip
            *.sha256

      # ── 12. Upload wheels PyPI (optionnel) ────────────────────────────────
      - name: Upload PyPI wheels (optionnel)
        if: ${{ github.event.inputs.include_wheels == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: uv-wheel-windows-x86_64-${{ steps.resolve-ref.outputs.VERSION }}
          path: dist
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — SCANS DE SECURITE (SEQUENTIELS sur UN SEUL runner Ubuntu)
  # Ordre: ClamAV → Semgrep → GuardDog → CodeQL → Gitleaks → Bearer
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: "Security scans (sequentiel)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:

      - name: Resolve ref
        id: resolve-ref
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ github.event.inputs.ref }}"
          if [ "$INPUT_REF" = "latest" ]; then
            RESOLVED=$(git ls-remote --tags --sort=-v:refname https://github.com/astral-sh/uv.git \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -v '\^{}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -1)
          else
            RESOLVED="$INPUT_REF"
          fi
          echo "resolved_ref=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Checkout astral-sh/uv
        uses: actions/checkout@v4
        with:
          repository: astral-sh/uv
          ref: ${{ steps.resolve-ref.outputs.resolved_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.21"

      # ── 1. ClamAV ─────────────────────────────────────────────────────────
      - name: "1/6 ClamAV - antivirus"
        continue-on-error: true
        shell: bash
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "freshclam warning - using default db"
          clamscan -r -i --max-filesize=100M --max-scansize=500M . > clamav-report.txt || true
          tail -20 clamav-report.txt

      # ── 2. Semgrep ────────────────────────────────────────────────────────
      - name: "2/6 Semgrep - SAST & secrets"
        continue-on-error: true
        shell: bash
        run: |
          pip install -q semgrep
          semgrep scan \
            --config "p/default" \
            --config "p/secrets" \
            --config "p/security-audit" \
            --sarif --output semgrep.sarif . || true

      # ── 3. GuardDog ───────────────────────────────────────────────────────
      - name: "3/6 GuardDog - malicious packages"
        continue-on-error: true
        shell: bash
        run: |
          pip install -q guarddog
          shopt -s nullglob
          # requirements.txt
          for f in $(find . -maxdepth 4 -name "requirements*.txt" -not -path "*/node_modules/*" -not -path "*/target/*" -not -path "*/.git/*" 2>/dev/null); do
            echo "==> GuardDog PyPI: $f"
            guarddog pypi verify "$f" --output-format json > "guarddog-pypi-$(basename "$f").json" 2>&1 || true
          done
          # package.json
          for f in $(find . -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" -not -path "*/target/*" -not -path "*/.git/*" 2>/dev/null); do
            echo "==> GuardDog npm: $f"
            guarddog npm verify "$f" --output-format json > "guarddog-npm-$(basename "$f").json" 2>&1 || true
          done

      # ── 4. CodeQL (Python + Rust) ─────────────────────────────────────────
      - name: "4/6 CodeQL - init"
        uses: github/codeql-action/init@v3
        with:
          languages: python,rust
          queries: security-extended,security-and-quality
      - name: "4/6 CodeQL - autobuild"
        continue-on-error: true
        uses: github/codeql-action/autobuild@v3
      - name: "4/6 CodeQL - analyze"
        continue-on-error: true
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results

      # ── 5. Gitleaks ───────────────────────────────────────────────────────
      - name: "5/6 Gitleaks - git history secrets"
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      # ── 6. Bearer ─────────────────────────────────────────────────────────
      - name: "6/6 Bearer - SAST & secrets"
        continue-on-error: true
        shell: bash
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          bearer scan . --format sarif --output bearer.sarif \
            --severity critical,high,medium --scanner secrets --quiet || true

      # ── Upload centralise des rapports ────────────────────────────────────
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            clamav-report.txt
            semgrep.sarif
            guarddog-*.json
            codeql-results/
            bearer.sarif
            results.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — SYNTHESE
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [build-windows, security]
    if: always()
    steps:
      - name: Write Job Summary
        shell: bash
        run: |
          BUILD_STATUS="${{ needs.build-windows.result }}"
          SEC_STATUS="${{ needs.security.result }}"
          VERSION="${{ needs.build-windows.outputs.version }}"

          icon() {
            case "$1" in
              success)   echo ":white_check_mark:" ;;
              failure)   echo ":x:" ;;
              skipped)   echo ":next_track_button:" ;;
              cancelled) echo ":no_entry_sign:" ;;
              *)         echo ":warning:" ;;
            esac
          }

          {
            echo "# :lock: Build & Security Report - uv ${VERSION}"
            echo ""
            echo "| Job                          | Status              |"
            echo "|------------------------------|---------------------|"
            echo "| :building_construction: Build Windows x86_64 | $(icon "$BUILD_STATUS") ${BUILD_STATUS} |"
            echo "| :shield: Security scans (6 outils) | $(icon "$SEC_STATUS") ${SEC_STATUS} |"
            echo ""
            echo "## :package: Artifacts"
            echo ""
            echo "- \`uv-windows-standalone-${VERSION}.zip\` (+ \`.sha256\`) : binaires standalone **uv.exe / uvx.exe / uvw.exe** + README"
            echo "- \`security-reports\` : rapports detailles ClamAV, Semgrep, GuardDog, CodeQL (Python+Rust), Gitleaks, Bearer"
            echo ""
            echo "## :tools: Ordre des scans"
            echo ""
            echo "\`ClamAV -> Semgrep -> GuardDog -> CodeQL (Python+Rust) -> Gitleaks -> Bearer\`"
            echo ""
            echo "---"
            echo "*Build declenche manuellement depuis astral-sh/uv (ref: \`${{ github.event.inputs.ref }}\`)*"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== SUMMARY ==="
          echo "Build    : $BUILD_STATUS"
          echo "Security : $SEC_STATUS"
          echo "Version  : $VERSION"
