name: Build & Security Scan

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'owner/repo du projet source à builder'
        type: string
        default: 'DeusData/codebase-memory-mcp'
      ref:
        description: 'Branche, tag ou SHA à builder'
        type: string
        default: 'main'
      version:
        description: 'Forcer une version (laisser vide pour auto-détection via git describe dans le clone)'
        type: string
        default: ''
      attest:
        description: 'Générer les attestations de provenance des artefacts'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 : BUILD WINDOWS AMD64
  # ───────────────────────────────────────────────────────────────────────────
  build-windows-amd64:
    name: "🏗️ Build Windows AMD64"
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout project source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify source layout
        shell: bash
        run: |
          if [ ! -f scripts/build.sh ]; then
            echo "::error::scripts/build.sh introuvable dans ${{ inputs.repository }}@${{ inputs.ref }}."
            exit 1
          fi

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            make
            zip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Build standard binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh CC=clang CXX=clang++
          fi

      - name: Archive standard binary
        shell: msys2 {0}
        run: |
          make -f Makefile.cbm build/c/codebase-memory-mcp-launcher.exe CC=clang CXX=clang++
          PAYLOAD=build/c/codebase-memory-mcp
          [ -f "${PAYLOAD}.exe" ] && PAYLOAD="${PAYLOAD}.exe"
          cp build/c/codebase-memory-mcp-launcher.exe codebase-memory-mcp.exe
          cp "$PAYLOAD" codebase-memory-mcp.payload.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip codebase-memory-mcp-windows-amd64.zip \
            codebase-memory-mcp.exe codebase-memory-mcp.payload.exe \
            LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - name: Attest standard binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-windows-amd64.zip

      - name: Build UI binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh --with-ui CC=clang CXX=clang++
          fi

      - name: Archive UI binary
        shell: msys2 {0}
        run: |
          make -f Makefile.cbm build/c/codebase-memory-mcp-launcher.exe CC=clang CXX=clang++
          PAYLOAD=build/c/codebase-memory-mcp
          [ -f "${PAYLOAD}.exe" ] && PAYLOAD="${PAYLOAD}.exe"
          cp build/c/codebase-memory-mcp-launcher.exe codebase-memory-mcp.exe
          cp "$PAYLOAD" codebase-memory-mcp.payload.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip codebase-memory-mcp-ui-windows-amd64.zip \
            codebase-memory-mcp.exe codebase-memory-mcp.payload.exe \
            LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - name: Attest UI binary provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: codebase-memory-mcp-ui-windows-amd64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-windows-amd64
          path: "*.zip"

───────────────────────────────────────────────────────────────────────────
  # JOB 2 : CLAMAV (NOUVEAU - Scan Malwares & Signatures suspectes)
  # ───────────────────────────────────────────────────────────────────────────
  clamav:
    name: "🦠 ClamAV – Malware & Stealer Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - name: Install ClamAV & Update Signatures
        run: |
          sudo apt-get update && sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "Freshclam failed, using default database."

      - name: Scan Repository
        run: |
          clamscan -r -i . > clamav-report.txt || true

      - name: Upload ClamAV Report
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.txt

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 : SEMGREP
  # ───────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔎 Semgrep – Code Patterns & Obfuscation"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/secrets" --config "p/security-audit" --sarif --output semgrep.sarif . || true

      # Upload en tant qu'artifact au lieu d'utiliser l'API GitHub Security
      - name: Upload Semgrep SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 : GUARDDOG
  # ───────────────────────────────────────────────────────────────────────────
  guarddog:
    name: "🐕 GuardDog – Malicious Packages"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run GuardDog Scans
        run: |
          pip install guarddog
          for f in $(find . -name "requirements*.txt" -not -path "*/node_modules/*" 2>/dev/null); do
            guarddog pypi verify "$f" --output-format json > "guarddog-pypi-$(basename "$f").json" 2>&1 || true
          done
          for f in $(find . -name "package.json" -not -path "*/node_modules/*" 2>/dev/null); do
            guarddog npm verify "$f" --output-format json > "guarddog-npm-$(basename "$f").json" 2>&1 || true
          done

      - name: Upload GuardDog results
        uses: actions/upload-artifact@v4
        with:
          name: guarddog-results
          path: guarddog-*.json
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 : CODEQL (Corrigé pour éviter l'erreur commit)
  # ───────────────────────────────────────────────────────────────────────────
  codeql:
    name: "🧬 CodeQL – Analysis"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        language: [ 'javascript-typescript', 'python', 'go' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '>=1.21'
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          
      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis (Sans upload automatique)
        uses: github/codeql-action/analyze@v3
        with:
          upload: never # EMPÊCHE L'ERREUR DE COMMIT API
          output: codeql-results-${{ matrix.language }}

      - name: Upload CodeQL Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report-${{ matrix.language }}
          path: codeql-results-${{ matrix.language }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6 : GITLEAKS
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: "🔑 Gitleaks – Secrets"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 7 : BEARER
  # ───────────────────────────────────────────────────────────────────────────
  bearer:
    name: "🛡️ Bearer – SAST & Secrets"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - name: Run Bearer scan
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          bearer scan . --format sarif --output bearer.sarif --severity critical,high,medium --scanner secrets --quiet || true

      # Upload en tant qu'artifact au lieu d'utiliser l'API GitHub Security
      - name: Upload Bearer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bearer-report
          path: bearer.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB FINAL : SUMMARY
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "📋 Security & Build Summary"
    runs-on: ubuntu-latest
    needs: [ build-mcp-agent, clamav, semgrep, guarddog, codeql, gitleaks, bearer ]
    if: always()
    steps:
      - name: Write Job Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🔒 Build & Security Report

          | Job | Statut |
          |-----|--------|
          | 🏗️ Build Windows AMD64   | ${{ needs.build-mcp-agent.result }} |
          | 🦠 ClamAV (Malware)      | ${{ needs.clamav.result }} |
          | 🔎 Semgrep               | ${{ needs.semgrep.result }} |
          | 🐕 GuardDog             | ${{ needs.guarddog.result }} |
          | 🧬 CodeQL               | ${{ needs.codeql.result }} |
          | 🔑 Gitleaks             | ${{ needs.gitleaks.result }} |
          | 🛡️ Bearer                | ${{ needs.bearer.result }} |
          
          ℹ️ **Note:** Les rapports de sécurité détaillés (fichiers .sarif et .txt) sont téléchargeables dans la section "Artifacts" ci-dessous.
          EOF
