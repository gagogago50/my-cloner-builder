name: Build Cheat Engine

# =============================================================================
#  Build complet de cheat-engine/cheat-engine SANS fork.
#
#  Reconstruit sur la base d'un workflow qui produisait deja correctement
#  cheatengine-i386/x86_64/x86_64-SSE4-AVX2, mais dont le zip ne contenait
#  AUCUNE dependance (DotNetDataCollector, DotNetInterface, MonoDataCollector,
#  CSCompiler, tcc, vehdebug, speedhack...).
#
#  Les 5 causes racines identifiees sont corrigees : voir README.md.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/repo (ex: cheat-engine/cheat-engine)"
        required: true
        default: "cheat-engine/cheat-engine"
        type: string
      ref:
        description: "branch / tag / sha"
        required: false
        default: "master"
        type: string
      lazarus_version:
        description: "Version de Lazarus"
        required: false
        default: "2.2.6"
        type: choice
        options: ["2.2.6", "2.2.2"]
      dotnet_version:
        description: "Version du SDK .NET"
        required: false
        default: "8.0.x"
        type: choice
        options: ["8.0.x", "9.0.x"]
      enable_avx:
        description: "Compiler aussi le mode AVX2"
        required: false
        default: true
        type: boolean
      build_native_deps:
        description: "Dependances C++/.NET (DotNetDataCollector, Mono, CSCompiler, tcc...)"
        required: false
        default: true
        type: boolean
      build_dbkernel:
        description: "dbk32.sys / dbk64.sys (WDK, pilote NON signe)"
        required: false
        default: false
        type: boolean
      build_directx:
        description: "Hooks D3D9/10/11 (telecharge le DirectX SDK June 2010, ~570 Mo)"
        required: false
        default: false
        type: boolean
      run_security_scan:
        description: "Executer le job de scan de securite (gitleaks/ClamAV)"
        required: false
        default: false
        type: boolean
      fail_on_missing_deps:
        description: "Faire echouer le build si une dependance attendue manque"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Repertoires cibles, resous une fois pour toutes.
  CE_DIR: ${{ github.workspace }}\Cheat Engine
  BIN_DIR: ${{ github.workspace }}\Cheat Engine\bin

jobs:
  # ===========================================================================
  #  Scan de securite - optionnel, jamais bloquant
  # ===========================================================================
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    if: ${{ inputs.run_security_scan }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: ClamAV
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo freshclam --quiet || true
          clamscan --recursive --infected --quiet . || true

  # ===========================================================================
  #  Build principal
  # ===========================================================================
  build:
    name: Build CE + dependances
    runs-on: windows-2022
    timeout-minutes: 180
    # Sans cette condition, un job `needs` skipped entraine le skip du job
    # dependant : le build ne tournerait jamais quand run_security_scan=false.
    if: ${{ !cancelled() && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') }}
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive

      # -----------------------------------------------------------------
      # 1. Chaine d'outils
      # -----------------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
        continue-on-error: true

      - name: Setup Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: ${{ inputs.lazarus_version }}
          with-cache: true

      - name: Resolve Lazarus directory
        shell: pwsh
        run: |
          $lazDir = $null
          $cmd = Get-Command lazbuild -ErrorAction SilentlyContinue
          if ($cmd) {
              $d = Split-Path -Parent $cmd.Source
              while ($d -and -not (Test-Path (Join-Path $d 'fpc'))) { $d = Split-Path -Parent $d }
              if ($d) { $lazDir = $d }
          }
          if (-not $lazDir) {
              foreach ($c in @('C:\lazarus', 'C:\Program Files\Lazarus', "$env:RUNNER_TEMP\installers\lazarus")) {
                  if (Test-Path (Join-Path $c 'lazbuild.exe')) { $lazDir = $c; break }
              }
          }
          if (-not $lazDir) {
              $found = Get-ChildItem -Path 'C:\', 'D:\a' -Filter 'lazbuild.exe' -Recurse -Depth 4 -ErrorAction SilentlyContinue |
                       Select-Object -First 1
              if ($found) { $lazDir = Split-Path -Parent $found.FullName }
          }
          if (-not $lazDir) { throw 'Racine Lazarus introuvable' }
          Write-Host "Racine Lazarus : $lazDir"
          "LAZARUS_DIR=$lazDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $lazDir 'lazbuild.exe') --version

      # Le cross-compiler i386-win32 n'est pas inclus par setup-lazarus :
      # sans lui, tous les modes 32 bits echouent (speedhack-i386, vehdebug-i386,
      # cheatengine-i386...).
      - name: Install i386-win32 cross-compiler
        continue-on-error: true
        shell: pwsh
        run: |
          $lazDir = $env:LAZARUS_DIR
          $fpcVer = '3.2.2'

          # Version reelle de Lazarus, lue depuis lazbuild (jamais devinee).
          $lazVer = '${{ inputs.lazarus_version }}'
          try {
              $v = & lazbuild --version 2>&1 | Out-String
              if ($v -match 'Lazarus\s+(\d+\.\d+\.\d+)') { $lazVer = $Matches[1] }
          } catch { }
          Write-Host "Lazarus $lazVer / FPC $fpcVer"

          $installer = "lazarus-$lazVer-fpc-$fpcVer-cross-i386-win32-win64.exe"
          $dest = Join-Path $env:RUNNER_TEMP $installer
          $mirrors = @(
              "https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%20$lazVer/$installer",
              "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%20$lazVer/$installer/download",
              "https://freepascal.dfmk.hu/pub/lazarus/releases/$installer"
          )

          function Get-Installer {
              param([string[]]$Urls, [string]$OutFile)
              foreach ($url in $Urls) {
                  for ($i = 1; $i -le 3; $i++) {
                      Write-Host "  tentative $i/3 : $url"
                      try {
                          Invoke-WebRequest -Uri $url -OutFile $OutFile -UseBasicParsing `
                              -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' `
                              -MaximumRedirection 15 -TimeoutSec 180 -ErrorAction Stop
                          # Un miroir SourceForge peut renvoyer une page HTML : on verifie le magic MZ.
                          $fs = [System.IO.File]::OpenRead($OutFile)
                          try {
                              $b = New-Object byte[] 2
                              [void]$fs.Read($b, 0, 2)
                          } finally { $fs.Dispose() }
                          if ([System.Text.Encoding]::ASCII.GetString($b) -eq 'MZ') {
                              Write-Host "  OK ($('{0:N1}' -f ((Get-Item $OutFile).Length / 1MB)) Mo)"
                              return $true
                          }
                          Write-Warning '  fichier recu invalide (pas un PE)'
                          Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                      } catch {
                          Write-Warning "  echec : $($_.Exception.Message)"
                          Start-Sleep -Seconds ([Math]::Min($i * 5, 15))
                      }
                  }
              }
              return $false
          }

          if (-not (Get-Installer -Urls $mirrors -OutFile $dest)) {
              Write-Warning 'Cross-compiler i386 indisponible : les cibles 32 bits seront absentes.'
              exit 0
          }

          $log = Join-Path $env:RUNNER_TEMP 'laz_cross.log'
          $p = Start-Process -FilePath $dest `
              -ArgumentList "/verysilent /suppressmsgboxes /norestart /nocloseapplications /DIR=`"$lazDir`" /LOG=`"$log`"" `
              -Wait -PassThru -NoNewWindow
          Write-Host "Code sortie : $($p.ExitCode)"

          $ppc386 = Get-ChildItem -Path $lazDir -Filter 'ppc386.exe' -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if ($ppc386) {
              Write-Host "ppc386 trouve : $($ppc386.FullName)"
              'HAVE_PPC386=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              Write-Warning 'ppc386.exe introuvable apres installation.'
              'HAVE_PPC386=false' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # -----------------------------------------------------------------
      # 2. Patchs sources
      #
      #    Inline (et non dans un fichier du depot) : le checkout vise
      #    cheat-engine/cheat-engine, qui ne contient evidemment pas nos
      #    scripts. Rien n'est commité, tout reste dans le workspace.
      #
      #    a) Tutorial/tutorial.lpi utilise VirtualTreeView sans declarer le
      #       paquet laz.virtualtreeview_package dans <RequiredPackages>
      #       (seul "LCL" y figure). L'IDE le resout implicitement, lazbuild
      #       non -> echec. cheatengine.lpi declare bien ce paquet.
      #    b) ceregreset.dpr contient {$R *.res} alors qu'aucun .res n'est
      #       versionne dans ceregreset/ -> FPC echoue.
      # -----------------------------------------------------------------
      - name: Apply source fixes
        shell: pwsh
        run: |
          # --- a) tutorial.lpi : paquet manquant ---
          $lpi = Join-Path $env:CE_DIR 'Tutorial\tutorial.lpi'
          if (Test-Path $lpi) {
              $raw = [System.IO.File]::ReadAllText($lpi)
              if ($raw -match 'laz\.virtualtreeview_package') {
                  Write-Host 'tutorial.lpi : paquet deja declare'
              } else {
                  $rx = [regex]'(?s)<RequiredPackages([^>]*)>(.*?)</RequiredPackages>'
                  $m = $rx.Match($raw)
                  if (-not $m.Success) {
                      Write-Warning 'tutorial.lpi : <RequiredPackages> introuvable'
                  } else {
                      $attrs = $m.Groups[1].Value
                      $body  = $m.Groups[2].Value
                      $count = 0
                      if ($attrs -match 'Count="(\d+)"') { $count = [int]$Matches[1] }
                      $newAttrs = if ($attrs -match 'Count="\d+"') {
                          ($attrs -replace 'Count="\d+"', "Count=`"$($count + 1)`"")
                      } else { $attrs + " Count=`"$($count + 1)`"" }
                      # Indentation alignee sur les <ItemN> existants.
                      $indent = '      '
                      if ($body -match '(?m)^([ \t]*)<Item\d+') { $indent = $Matches[1] }
                      $entry = "`r`n$indent<Item$($count + 1)>" `
                             + "`r`n$indent  <PackageName Value=`"laz.virtualtreeview_package`"/>" `
                             + "`r`n$indent</Item$($count + 1)>"
                      $newBody = $body.TrimEnd("`r", "`n", ' ') + $entry + "`r`n    "
                      $newBlock = "<RequiredPackages$newAttrs>$newBody</RequiredPackages>"
                      $raw = $raw.Substring(0, $m.Index) + $newBlock + $raw.Substring($m.Index + $m.Length)
                      # WriteAllText sans BOM, fins de ligne CRLF preservees.
                      [System.IO.File]::WriteAllText($lpi, $raw, (New-Object System.Text.UTF8Encoding $false))
                      Write-Host "tutorial.lpi : laz.virtualtreeview_package ajoute (Count=$($count + 1))"
                  }
              }
          }

          # --- b) ceregreset.dpr : {$R *.res} sans .res ---
          $dprDir = Join-Path $env:CE_DIR 'ceregreset'
          $dpr = Join-Path $dprDir 'ceregreset.dpr'
          if (Test-Path $dpr) {
              $hasRes = @(Get-ChildItem -Path $dprDir -Filter '*.res' -ErrorAction SilentlyContinue).Count -gt 0
              if ($hasRes) {
                  Write-Host 'ceregreset : un .res est present, rien a faire'
              } else {
                  $raw = [System.IO.File]::ReadAllText($dpr)
                  if ($raw -notmatch '\{\$R \*\.res\}') {
                      Write-Host 'ceregreset.dpr : directive {$R *.res} absente'
                  } else {
                      $raw = $raw -replace '\{\$R \*\.res\}', ''
                      [System.IO.File]::WriteAllText($dpr, $raw, (New-Object System.Text.UTF8Encoding $false))
                      Write-Host 'ceregreset.dpr : directive {$R *.res} retiree'
                  }
              }
          }

      # -----------------------------------------------------------------
      # 3. Dependances de la chaine native
      #
      #    CAUSE RACINE n.1 : DotNetDataCollector.vcxproj code en dur
      #      C:\Program Files (x86)\Windows Kits\NETFXSDK\4.7.2\Include\um
      #    et lie CorGuids.lib. Ces en-tetes (CorDebug.h, clrdata.h,
      #    metahost.h) ne sont PAS dans le Windows SDK 10 : ils viennent du
      #    .NET Framework Developer Pack, qui cree exactement ce repertoire.
      #    Installer le SDK 8.1 ne sert donc a rien.
      # -----------------------------------------------------------------
      - name: Install .NET Framework 4.7.2 Developer Pack (NETFXSDK)
        if: ${{ inputs.build_native_deps }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hdr = 'C:\Program Files (x86)\Windows Kits\NETFXSDK\4.7.2\Include\um\CorDebug.h'
          $lib = 'C:\Program Files (x86)\Windows Kits\NETFXSDK\4.7.2\Lib\um\x64\CorGuids.lib'
          if ((Test-Path $hdr) -and (Test-Path $lib)) {
              Write-Host 'NETFXSDK 4.7.2 deja present.'
              exit 0
          }
          $url = 'https://download.visualstudio.microsoft.com/download/pr/158dce74-251c-4af3-b8cc-4608621341c8/9c1e178a11f55478e2112714a3897c1a/ndp472-devpack-enu.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'ndp472-devpack.exe'
          & curl.exe -L --retry 5 --retry-delay 3 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw 'Telechargement du Developer Pack 4.7.2 impossible' }
          $p = Start-Process $exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          # 3010 = succes avec redemarrage recommande, acceptable en CI.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "ndp472-devpack a echoue (code $($p.ExitCode))" }
          if (-not (Test-Path $hdr)) { throw "CorDebug.h toujours introuvable : $hdr" }
          if (-not (Test-Path $lib)) { throw "CorGuids.lib toujours introuvable : $lib" }
          Write-Host 'NETFXSDK 4.7.2 operationnel.'

      - name: Install .NET Framework 4.6.1 Developer Pack (CSCompiler)
        if: ${{ inputs.build_native_deps }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1'
          if (Test-Path "$root\mscorlib.dll") { Write-Host 'v4.6.1 deja present.'; exit 0 }
          $url = 'https://download.visualstudio.microsoft.com/download/pr/33a48e6c-c0d1-4321-946b-042b92bad691/a9a88bd451286ab9ea015ecc2208d725/ndp461-devpack-kb3105179-enu.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'ndp461-devpack.exe'
          & curl.exe -L --retry 5 --retry-delay 3 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw 'Telechargement du Developer Pack 4.6.1 impossible' }
          $p = Start-Process $exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "ndp461-devpack a echoue (code $($p.ExitCode))" }

      # DotNetInterface2.csproj cible .NET Framework 4.0, absent de l'image.
      - name: Restore .NET Framework 4.0 reference assemblies
        if: ${{ inputs.build_native_deps }}
        shell: pwsh
        run: |
          $dest = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0'
          if (Test-Path "$dest\mscorlib.dll") { Write-Host 'v4.0 deja present.'; exit 0 }
          $work = Join-Path $env:RUNNER_TEMP 'refasm'
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory $work | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'nuget install a echoue' }
          $src = Get-ChildItem -Path $work -Directory -Filter 'Microsoft.NETFramework.ReferenceAssemblies.net40.*' |
                 Select-Object -First 1
          $src = Join-Path $src.FullName 'build\.NETFramework\v4.0'
          if (-not (Test-Path $src)) { throw "Source introuvable : $src" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*" $dest -Recurse -Force
          if (-not (Test-Path "$dest\mscorlib.dll")) { throw 'v4.0 reference assemblies introuvables apres copie' }
          Write-Host 'v4.0 reference assemblies installees.'

      # -----------------------------------------------------------------
      # 4. Retarget des projets C++ legacy
      #
      #    L'image ne fournit que v142/v143. Les .vcxproj du depot epinglent
      #    v120 / v140 / v141 / v141_xp -> MSB8020 sans retarget.
      #    On ne touche PAS aux IncludePath/LibraryPath : ils doivent continuer
      #    a viser NETFXSDK\4.7.2, installe a l'etape precedente.
      # -----------------------------------------------------------------
      - name: Retarget C++ projects to v143 + Windows 10 SDK
        if: ${{ inputs.build_native_deps }}
        shell: pwsh
        run: |
          $targets = @(
              (Join-Path $env:GITHUB_WORKSPACE 'Cheat Engine'),
              (Join-Path $env:GITHUB_WORKSPACE 'DBKKernel')
          )
          $retargeted = @()
          foreach ($root in $targets) {
              if (-not (Test-Path $root)) { continue }
              Get-ChildItem -Path $root -Recurse -Filter '*.vcxproj' -ErrorAction SilentlyContinue | ForEach-Object {
                  $raw = [System.IO.File]::ReadAllText($_.FullName)
                  $new = $raw
                  foreach ($old in @('v120_xp', 'v141_xp', 'v120', 'v140', 'v141', 'v142')) {
                      $new = $new -replace "<PlatformToolset>$old</PlatformToolset>", '<PlatformToolset>v143</PlatformToolset>'
                  }
                  $new = $new -replace '<WindowsTargetPlatformVersion>8\.[01]</WindowsTargetPlatformVersion>', '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>'
                  if ($new -ne $raw) {
                      [System.IO.File]::WriteAllText($_.FullName, $new)
                      $retargeted += $_.Name
                  }
              }
          }
          Write-Host "Retarget v143 : $($retargeted.Count) projet(s)"
          $retargeted | ForEach-Object { Write-Host "  - $_" }

      # -----------------------------------------------------------------
      # 5. Cheat Engine lui-meme (ce qui fonctionnait deja)
      # -----------------------------------------------------------------
      - name: Build Cheat Engine
        shell: pwsh
        run: |
          $proj = Join-Path $env:CE_DIR 'cheatengine.lpi'
          if (-not (Test-Path $proj)) { throw "Projet introuvable : $proj" }

          $modes = @('Release 64-Bit')
          if ('${{ inputs.enable_avx }}' -eq 'true') { $modes += 'Release 64-Bit O4 AVX2' }
          if ($env:HAVE_PPC386 -eq 'true')           { $modes += 'Release 32-Bit' }

          $failed = @()
          foreach ($m in $modes) {
              Write-Host "::group::cheatengine.lpi [$m]"
              & lazbuild --build-mode="$m" --no-write-project --max-process-count=4 $proj 2>&1
              $code = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($code -ne 0) {
                  Write-Warning "Mode '$m' echoue (code $code)"
                  $failed += $m
              }
          }
          # 'Release 64-Bit' est le seul mode indispensable.
          if ($failed -contains 'Release 64-Bit') { throw "Le mode critique 'Release 64-Bit' a echoue." }

      # -----------------------------------------------------------------
      # 6. Sous-projets Lazarus
      #
      #    CAUSE RACINE n.2 : l'ancienne version passait --build-mode="Release"
      #    a tous les sous-projets. Or 13 des 14 .lpi concernes n'ont AUCUN
      #    mode nomme "Release" (speedhack -> "32-bit"/"64-bit",
      #    vehdebug -> "release 32", winhook -> "Release 32"...). Tous
      #    echouaient donc silencieusement.
      #    Les modes ci-dessous ont ete lus dans chaque .lpi du depot.
      # -----------------------------------------------------------------
      - name: Build Lazarus sub-projects
        shell: pwsh
        run: |
          # Projet | modes exacts | produit par le mode
          $projects = @(
              @{ P = 'VEHDebug\vehdebug.lpi';                        M = @('release 32', 'release 64') },
              @{ P = 'speedhack\speedhack.lpi';                      M = @('32-bit', '64-bit') },
              @{ P = 'luaclient\luaclient.lpi';                      M = @('Release 32', 'Release 64') },
              @{ P = 'allochook\allochook.lpi';                      M = @('32', '64') },
              @{ P = 'winhook\winhook.lpi';                          M = @('Release 32', 'Release 64') },
              @{ P = 'Tutorial\tutorial.lpi';                        M = @('release 32-Bit', 'release 64-Bit') },
              # gtutorial-*.exe est lance par MainUnit.pas et Unit10.pas
              @{ P = 'Tutorial\graphical\project1.lpi';              M = @('Release 32', 'Release 64') },
              @{ P = 'launcher\cheatengine.lpi';                     M = @('release', 'release rtmod') },
              @{ P = 'ceregreset\ceregreset.lpi';                    M = @('Release', 'Release runtime mod') },
              @{ P = 'windowsrepair\windowsrepair.lpi';              M = @('Release') },
              @{ P = 'cepack\cepack.lpi';                            M = @('Default') },
              @{ P = 'sfx\level2\standalonephase2.lpi';              M = @('Release') },
              @{ P = 'xmplayer\xmplayer.lpi';                        M = @('Default') },
              @{ P = 'dbk32\Kernelmodule unloader\Kernelmoduleunloader.lpi'; M = @('default') },
              @{ P = 'plugin\example\exampleplugin.lpi';             M = @('Default') },
              @{ P = 'plugin\DebugEventLog\src\DebugEventLog.lpi';   M = @('Default') }
          )

          $ok = @(); $ko = @()
          foreach ($e in $projects) {
              $proj = Join-Path $env:CE_DIR $e.P
              if (-not (Test-Path $proj)) { Write-Warning "absent : $($e.P)"; continue }
              foreach ($m in $e.M) {
                  Write-Host "::group::$($e.P) [$m]"
                  & lazbuild --build-mode="$m" --no-write-project --max-process-count=4 $proj 2>&1
                  $code = $LASTEXITCODE
                  Write-Host "::endgroup::"
                  if ($code -eq 0) { $ok += "$($e.P) [$m]" } else { $ko += "$($e.P) [$m]" }
              }
          }
          Write-Host ""
          Write-Host "Sous-projets OK   : $($ok.Count)"
          $ok | ForEach-Object { Write-Host "  + $_" }
          Write-Host "Sous-projets KO   : $($ko.Count)"
          $ko | ForEach-Object { Write-Host "  - $_" }
          ($ok + $ko | Out-String) | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'lazarus_subprojects.txt') -Encoding utf8

      # -----------------------------------------------------------------
      # 7. Dependances C++/.NET
      #
      #    CAUSE RACINE n.3 : l'ancienne version devinait la plateforme avec
      #    la regex '^\s*Release\|(\S+)\s*='. Elle ne capture rien sur
      #    "Release|Any CPU" (le \S+ s'arrete a l'espace) ni sur les configs
      #    de tcc ("Output to 32 (Release)|Win32"). Les builds partaient donc
      #    sur une config par defaut aleatoire.
      #    Les couples Configuration|Platform ci-dessous sont explicites.
      #
      #    CAUSE RACINE n.4 : les sorties de ces projets vont DIRECTEMENT dans
      #    Cheat Engine\bin (OutDir = ..\..\bin). Recopier "les fichiers dont
      #    le chemin contient Release" ne capturait rien. Rien a copier.
      # -----------------------------------------------------------------
      - name: Build native and .NET dependencies
        if: ${{ inputs.build_native_deps }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $results = [ordered]@{}

          # Cible msbuild | dossier de travail | couples Configuration|Platform
          $jobs = @(
              @{ N = 'DotNetDataCollector'; D = 'Cheat Engine\DotNetDataCollector';
                 S = 'DotNetDataCollector.sln';
                 C = @('Release|Win32', 'Release|x64');
                 O = @('DotNetDataCollector32.exe', 'DotNetDataCollector64.exe') },

              @{ N = 'MonoDataCollector';   D = 'Cheat Engine\MonoDataCollector';
                 S = 'MonoDataCollector.sln';
                 C = @('Release|Win32', 'Release|x64');
                 O = @('autorun\dlls\MonoDataCollector32.dll', 'autorun\dlls\MonoDataCollector64.dll') },

              @{ N = 'CSCompiler';          D = 'Cheat Engine\DotNetCompiler\CSCompiler';
                 S = 'CSCompiler.sln';
                 C = @('Release|Any CPU');
                 O = @('CSCompiler.dll') },

              @{ N = 'tcclib';              D = 'Cheat Engine\tcclib\win32\tcc';
                 S = 'tcc.sln';
                 # Mapping verifie dans tcc.vcxproj : TargetName = tcc$(PlatformArchitecture)-<cible>
                 # et PlatformArchitecture vaut 32 pour Win32, 64 pour x64. D'ou :
                 #   Output to 32 (Release)|Win32          -> tcc32-32.dll
                 #   Output to 32 (Release)|x64            -> tcc64-32.dll
                 #   Output to 64 (Release)|x64            -> tcc64-64.dll
                 #   Output to 32 Linux ABI (Release)|x64  -> tcc64-32-linux.dll
                 #   Output to 64 Linux ABI (Release)|x64  -> tcc64-64-linux.dll
                 # Les variantes |Win32 des configs "Linux ABI" produiraient
                 # tcc32-*-linux.dll, que tcclib.pas ne charge jamais.
                 C = @('Output to 32 (Release)|Win32', 'Output to 32 (Release)|x64',
                       'Output to 64 (Release)|x64',
                       'Output to 32 Linux ABI (Release)|x64', 'Output to 64 Linux ABI (Release)|x64');
                 O = @('tcc32-32.dll', 'tcc64-32.dll', 'tcc64-64.dll',
                       'tcc64-32-linux.dll', 'tcc64-64-linux.dll') }
          )

          foreach ($j in $jobs) {
              $dir = Join-Path $env:GITHUB_WORKSPACE $j.D
              $sln = Join-Path $dir $j.S
              if (-not (Test-Path $sln)) {
                  Write-Warning "[$($j.N)] solution introuvable : $sln"
                  $results[$j.N] = 'absent'; continue
              }
              $buildOk = $true
              foreach ($cfg in $j.C) {
                  $conf, $plat = $cfg -split '\|', 2
                  Write-Host "::group::$($j.N) [$cfg]"
                  & msbuild $sln -nologo -verbosity:minimal -m `
                      -p:Configuration="$conf" -p:Platform="$plat" 2>&1
                  $code = $LASTEXITCODE
                  Write-Host "::endgroup::"
                  if ($code -ne 0) { Write-Warning "  [$($j.N)] $cfg -> code $code"; $buildOk = $false }
              }
              $results[$j.N] = if ($buildOk) { 'compile' } else { 'partiel' }
          }

          # DotNetInterface : on construit DotNetInterface2.csproj (net40), PAS
          # DotNetInterface.csproj (netstandard2.0) dont l'OutputPath est absolu
          # et pointe sur D:\git\cheat-engine\... -> il ecrirait hors du workspace.
          $di = Join-Path $env:GITHUB_WORKSPACE 'Cheat Engine\DotNetInvasiveDataCollector\DotNetInterface2\DotNetInterface2.csproj'
          if (Test-Path $di) {
              Write-Host '::group::DotNetInterface [Release]'
              & msbuild $di -nologo -verbosity:minimal -m -p:Configuration=Release `
                  -p:TargetFrameworkRootPath='C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework' 2>&1
              Write-Host '::endgroup::'
              $results['DotNetInterface'] = if ($LASTEXITCODE -eq 0) { 'compile' } else { 'echec' }
          }

          if ('${{ inputs.build_dbkernel }}' -eq 'true') {
              $dbk = Join-Path $env:GITHUB_WORKSPACE 'DBKKernel\DBKKernel.sln'
              if (Test-Path $dbk) {
                  foreach ($plat in @('x64', 'Win32')) {
                      Write-Host "::group::DBKKernel [Release|$plat]"
                      & msbuild $dbk -nologo -verbosity:minimal -m -p:Configuration=Release -p:Platform=$plat 2>&1
                      Write-Host '::endgroup::'
                  }
                  $results['DBKKernel'] = 'compile'
              }
          }

          $results.GetEnumerator() | ForEach-Object { Write-Host ("{0,-22} {1}" -f $_.Key, $_.Value) }
          ($results | Out-String) | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'native_deps.txt') -Encoding utf8

      # Hooks D3D : d3dx9.h / d3dx10.h / d3dx11.h n'existent QUE dans le
      # DirectX SDK June 2010 (retires du Windows SDK). Optionnel : les DLL
      # precompilees sont deja versionnees dans bin/.
      - name: Build DirectX hooks (optional)
        if: ${{ inputs.build_directx }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dx = 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)'
          if (-not (Test-Path "$dx\Include\d3dx9.h")) {
              $exe = Join-Path $env:RUNNER_TEMP 'DXSDK_Jun10.exe'
              & curl.exe -L --retry 3 -o $exe 'https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe'
              if ($LASTEXITCODE -ne 0) { throw 'Telechargement du DirectX SDK impossible' }
              $p = Start-Process $exe -ArgumentList '/U', '/quiet', '/norestart' -Wait -PassThru
              Write-Host "DirectX SDK : code $($p.ExitCode)"
          }
          # Le SxS error S1023 de l'installeur est connu et sans consequence ici.
          $sln = Join-Path $env:CE_DIR 'Direct x mess\Direct x mess.sln'
          foreach ($plat in @('Win32', 'x64')) {
              Write-Host "::group::Direct x mess [Release|$plat]"
              & msbuild $sln -nologo -verbosity:minimal -m -p:Configuration=Release -p:Platform=$plat `
                  -p:IncludePath="$dx\Include;`$(IncludePath)" `
                  -p:LibraryPath="$dx\Lib\$plat;`$(LibraryPath)" 2>&1
              Write-Host '::endgroup::'
          }

      # -----------------------------------------------------------------
      # 8. Verification : le filet qui manquait
      #
      #    CAUSE RACINE n.5 : aucun controle ne signalait l'absence des
      #    dependances. Le zip etait publie incomplet sans aucune erreur.
      # -----------------------------------------------------------------
      - name: Verify expected outputs
        shell: pwsh
        run: |
          $bin = $env:BIN_DIR
          if (-not (Test-Path $bin)) { throw "Dossier bin introuvable : $bin" }

          $core = @(
              'cheatengine-x86_64.exe',
              'Cheat Engine.exe',
              'ceregreset.exe',
              'cepack.exe',
              'standalonephase2.dat',
              'vehdebug-x86_64.dll',
              'speedhack-x86_64.dll',
              'luaclient-x86_64.dll',
              'tutorial-x86_64.exe',
              'gtutorial-x86_64.exe'
          )
          if ($env:HAVE_PPC386 -eq 'true') {
              $core += 'cheatengine-i386.exe', 'vehdebug-i386.dll', 'speedhack-i386.dll',
                       'luaclient-i386.dll', 'tutorial-i386.exe', 'gtutorial-i386.exe'
          }
          if ('${{ inputs.enable_avx }}' -eq 'true') { $core += 'cheatengine-x86_64-SSE4-AVX2.exe' }

          $deps = @()
          if ('${{ inputs.build_native_deps }}' -eq 'true') {
              $deps += 'DotNetDataCollector32.exe', 'DotNetDataCollector64.exe', 'CSCompiler.dll',
                       'autorun\dlls\DotNetInterface.dll',
                       'autorun\dlls\MonoDataCollector32.dll', 'autorun\dlls\MonoDataCollector64.dll',
                       'tcc32-32.dll', 'tcc64-32.dll', 'tcc64-64.dll',
                       'tcc64-32-linux.dll', 'tcc64-64-linux.dll'
          }
          if ('${{ inputs.build_dbkernel }}' -eq 'true') { $deps += 'dbk32.sys', 'dbk64.sys' }

          function Test-List {
              param([string[]]$Files, [string]$Label)
              $ok = @(); $ko = @()
              foreach ($f in $Files) {
                  if (Test-Path (Join-Path $bin $f)) { $ok += $f } else { $ko += $f }
              }
              Write-Host ""
              Write-Host "=== $Label : $($ok.Count)/$($Files.Count) ==="
              $ok | ForEach-Object { Write-Host "  OK   $_" }
              $ko | ForEach-Object { Write-Host "  MISS $_" }
              return , @($ok, $ko)
          }

          $rCore = Test-List -Files $core -Label 'Binaires principaux'
          $rDeps = Test-List -Files $deps -Label 'Dependances'

          $missingCore = $rCore[1]; $missingDeps = $rDeps[1]
          $allMissing = @($missingCore) + @($missingDeps)
          ($allMissing | Out-String) | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'missing.txt') -Encoding utf8

          if ($missingCore.Count -gt 0) {
              throw "Binaires principaux manquants : $($missingCore -join ', ')"
          }
          if ($missingDeps.Count -gt 0 -and '${{ inputs.fail_on_missing_deps }}' -eq 'true') {
              throw "Dependances manquantes : $($missingDeps -join ', ')"
          }
          if ($missingDeps.Count -gt 0) {
              Write-Warning "Dependances manquantes (non bloquant) : $($missingDeps -join ', ')"
          }

      # -----------------------------------------------------------------
      # 9. Assemblage
      #
      #    Nettoyage des fichiers de debug. On ne copie AUCUN .lib/.pdb dans
      #    bin : l'ancienne collecte automatique en ramassait, ce qui gonflait
      #    l'artefact de fichiers inutiles.
      # -----------------------------------------------------------------
      - name: Copy plugins
        shell: pwsh
        working-directory: Cheat Engine
        run: |
          if (Test-Path plugin) {
              Copy-Item plugin bin\plugins -Recurse -Force
              Write-Host 'Plugins copies dans bin\plugins'
          }

      - name: Strip debug files
        shell: pwsh
        working-directory: Cheat Engine\bin
        run: |
          $exts = @('*.pdb', '*.iobj', '*.ipdb', '*.dbg', '*.ilk', '*.exp', '*.obj', '*.tlog')
          $removed = 0
          foreach ($e in $exts) {
              Get-ChildItem -Recurse -File -Filter $e -ErrorAction SilentlyContinue | ForEach-Object {
                  Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue; $removed++
              }
          }
          Write-Host "$removed fichier(s) de debug supprime(s)"

      - name: Generate SHA256 checksums and manifest
        shell: pwsh
        run: |
          $bin = $env:BIN_DIR
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'build_manifest.txt'
          @(
              'Cheat Engine - Build Manifest',
              "Generated : $(Get-Date -Format 'o')",
              "Repository: ${{ inputs.repository }}",
              "Ref       : ${{ inputs.ref }}",
              "Commit    : ${{ github.sha }}",
              "Lazarus   : ${{ inputs.lazarus_version }}",
              ".NET SDK  : ${{ inputs.dotnet_version }}",
              "AVX2      : ${{ inputs.enable_avx }}",
              "Cross-i386: $($env:HAVE_PPC386)",
              '',
              'Files:'
          ) | Out-File -FilePath $manifest -Encoding utf8

          $hashes = Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'
          if (Test-Path $hashes) { Remove-Item $hashes -Force }
          Get-ChildItem -Path $bin -Recurse -File | Sort-Object FullName | ForEach-Object {
              $rel = $_.FullName.Substring($bin.Length + 1).Replace('\', '/')
              $sha = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$sha *$rel" | Out-File -FilePath $hashes -Append -Encoding utf8
              ('  {0,-58} {1,10} bytes  sha256:{2}' -f $rel, $_.Length, $sha.Substring(0, 12)) |
                  Out-File -FilePath $manifest -Append -Encoding utf8
          }
          Copy-Item $manifest, $hashes -Destination $bin -Force
          Write-Host "Manifeste genere ($((Get-Content $manifest).Count) lignes)"

      - name: Write step summary
        if: always()
        shell: pwsh
        run: |
          $bin = $env:BIN_DIR
          $s = $env:GITHUB_STEP_SUMMARY
          @(
              '# Cheat Engine - Build Summary',
              '',
              "- Depot : ``${{ inputs.repository }}`` @ ``${{ inputs.ref }}``",
              "- Lazarus ``${{ inputs.lazarus_version }}`` | .NET ``${{ inputs.dotnet_version }}`` | cross-i386 ``$($env:HAVE_PPC386)``",
              '',
              '## Dependances',
              '',
              '| Composant | Origine | Etat |',
              '|---|---|---|'
          ) | Out-File -FilePath $s -Encoding utf8

          $rows = @(
              @('DotNetDataCollector', 'DotNetDataCollector.sln', @('DotNetDataCollector32.exe', 'DotNetDataCollector64.exe')),
              @('DotNetInterface (JIT)', 'DotNetInterface2.csproj', @('autorun\dlls\DotNetInterface.dll')),
              @('MonoDataCollector', 'MonoDataCollector.sln', @('autorun\dlls\MonoDataCollector32.dll', 'autorun\dlls\MonoDataCollector64.dll')),
              @('CSCompiler', 'CSCompiler.sln', @('CSCompiler.dll')),
              @('tcclib', 'tcc.sln', @('tcc32-32.dll', 'tcc64-32.dll', 'tcc64-64.dll', 'tcc64-32-linux.dll', 'tcc64-64-linux.dll')),
              @('Tutorial', 'tutorial.lpi', @('tutorial-i386.exe', 'tutorial-x86_64.exe')),
              @('Tutorial graphique', 'graphical/project1.lpi', @('gtutorial-i386.exe', 'gtutorial-x86_64.exe')),
              @('VEH debugger', 'vehdebug.lpi', @('vehdebug-i386.dll', 'vehdebug-x86_64.dll')),
              @('Speedhack', 'speedhack.lpi', @('speedhack-i386.dll', 'speedhack-x86_64.dll')),
              @('luaclient', 'luaclient.lpi', @('luaclient-i386.dll', 'luaclient-x86_64.dll')),
              @('DBK kernel driver', 'DBKKernel.sln', @('dbk32.sys', 'dbk64.sys')),
              @('Hooks D3D', 'binaires du depot', @('ced3d9hook.dll', 'ced3d9hook64.dll')),
              @('CEJVMTI (Java)', 'binaires du depot', @('autorun\dlls\32\CEJVMTI.dll', 'autorun\dlls\64\CEJVMTI.dll'))
          )
          foreach ($r in $rows) {
              $ok = 0
              foreach ($f in $r[2]) { if (Test-Path (Join-Path $bin $f)) { $ok++ } }
              # Composants derriere un input : on distingue "non demande" de "echec".
              $requested = $true
              if ($r[0] -eq 'DBK kernel driver' -and '${{ inputs.build_dbkernel }}' -ne 'true') { $requested = $false }
              if ($r[0] -eq 'Hooks D3D' -and '${{ inputs.build_directx }}' -ne 'true') { $requested = $false }
              $state = if ($ok -eq $r[2].Count) { "OK $ok/$($r[2].Count)" }
                       elseif (-not $requested)  { 'non demande' }
                       elseif ($ok -gt 0)        { "PARTIEL $ok/$($r[2].Count)" }
                       else                      { "ABSENT 0/$($r[2].Count)" }
              "| ``$($r[0])`` | $($r[1]) | $state |" | Out-File -FilePath $s -Append -Encoding utf8
          }

          $missingFile = Join-Path $env:RUNNER_TEMP 'missing.txt'
          if ((Test-Path $missingFile) -and ((Get-Content $missingFile -Raw).Trim().Length -gt 0)) {
              @('', '## Fichiers manquants', '', '```', (Get-Content $missingFile -Raw).Trim(), '```') |
                  Out-File -FilePath $s -Append -Encoding utf8
          }

      # -----------------------------------------------------------------
      # 10. Artefacts
      # -----------------------------------------------------------------
      - name: Zip artifact
        shell: pwsh
        working-directory: Cheat Engine\bin
        run: |
          $out = "$($env:GITHUB_WORKSPACE)\CheatEngine-${{ github.sha }}.zip"
          & 7z a -tzip -mx=7 $out . | Select-Object -Last 10
          if ($LASTEXITCODE -ne 0) { throw 'Compression 7z echouee' }
          Write-Host "Artefact : $out ($('{0:N1}' -f ((Get-Item $out).Length / 1MB)) Mo)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CheatEngine-${{ github.sha }}
          path: CheatEngine-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build_manifest.txt
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
