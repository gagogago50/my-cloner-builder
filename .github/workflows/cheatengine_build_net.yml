name: Secure Build Cheat Engine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/repo (ex: cheat-engine/cheat-engine)"
        required: true
        default: "cheat-engine/cheat-engine"
        type: string
      ref:
        description: "branch / tag / sha"
        required: false
        default: "master"
        type: string
      artifact_path:
        description: "Glob du binaire principal a uploader"
        required: true
        default: "Cheat Engine/bin/**"
        type: string
      lazarus_version:
        description: "Version de Lazarus (2.2.2 recommande pour CE)"
        required: false
        default: "2.2.6"
        type: choice
        options:
          - "2.2.6"
          - "2.2.2"
      dotnet_version:
        description: "Version du SDK .NET"
        required: false
        default: "8.0.x"
        type: choice
        options:
          - "8.0.x"
          - "9.0.x"
          - "7.0.x"
      enable_avx:
        description: "Activer AVX/AVX2 pour DotNetDataCollector"
        required: false
        default: true
        type: boolean
      apply_code_patches:
        description: "Appliquer les patches d'amelioration"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  security-scans:
    name: "Sequential Security Scans"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Create Gitleaks allowlist
        run: |
          cat > .gitleaks.toml << 'EOF'
          [extend]
          useDefault = true
          [allowlist]
          description = "Faux positifs connus - code source Cheat Engine tiers"
          paths = [
            "Cheat Engine/feces\.pas",
            "Cheat Engine/frmluaengineunit\.lfm"
          ]
          EOF

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Setup ClamAV
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon
          sudo freshclam --quiet || true

      - name: Scan repository with ClamAV
        continue-on-error: true
        run: clamscan --recursive --infected --quiet . || true

      - name: Pattern scan
        continue-on-error: true
        run: |
          grep -rniE "(password|secret|token|api_key)" --include="*.pas" --include="*.lfm" --include="*.lpi" --include="*.lpr" . || true

  build:
    name: "Build Windows AMD64 + x86 + AVX"
    runs-on: windows-latest
    needs: security-scans
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive

      # ===================================================================
      # Setup toolchain
      # ===================================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
        continue-on-error: true

      - name: Setup NuGet cache
        if: ${{ success() }}
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ inputs.dotnet_version }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: ${{ inputs.lazarus_version }}
          with-cache: true

      - name: Resolve Lazarus directory
        shell: pwsh
        run: |
          $lazbuild = Get-Command lazbuild -ErrorAction SilentlyContinue
          $lazDir = $null
          if ($lazbuild) {
              $lazDir = Split-Path -Parent $lazbuild.Source
              while ($lazDir -and -not (Test-Path (Join-Path $lazDir "fpc"))) {
                  $lazDir = Split-Path -Parent $lazDir
              }
          }
          $candidates = @("D:\a\_temp\installers\lazarus", "C:\lazarus", "C:\Program Files\Lazarus")
          if (-not $lazDir) {
              foreach ($c in $candidates) {
                  if (Test-Path (Join-Path $c "lazbuild.exe")) { $lazDir = $c; break }
              }
          }
          if (-not $lazDir) {
              $found = Get-ChildItem -Path "D:\a" -Filter "lazbuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $lazDir = Split-Path -Parent $found.FullName }
          }
          if (-not $lazDir) { throw "Dossier Lazarus introuvable" }
          Write-Host "Racine Lazarus: $lazDir"
          echo "LAZARUS_DIR=$lazDir" >> $env:GITHUB_ENV

      # ===================================================================
      # Cross-compiler i386-win32 (best-effort)
      # ===================================================================
      - name: Try install i386 cross-compiler
        continue-on-error: true
        shell: pwsh
        env:
          LAZARUS_DIR: ${{ env.LAZARUS_DIR }}
        run: |
          $lazDir = $env:LAZARUS_DIR
          $fpcVer = "3.2.2"
          $lazVer = "${{ inputs.lazarus_version }}"
          try {
              $lazVerRaw = & lazbuild --version 2>&1 | Select-String -Pattern "Lazarus\s+(\d+\.\d+\.\d+)" | Select-Object -First 1
              if ($lazVerRaw -match "(\d+\.\d+\.\d+)") { $lazVer = $matches[1] }
          } catch {}
          Write-Host "Version Lazarus: $lazVer"

          $crossInstaller = "lazarus-$lazVer-fpc-$fpcVer-cross-i386-win32-win64.exe"
          $dest = Join-Path $env:RUNNER_TEMP $crossInstaller

          $mirrors = @(
              "https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%20$lazVer/$crossInstaller",
              "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%20$lazVer/$crossInstaller/download",
              "https://freepascal.dfmk.hu/pub/lazarus/releases/$crossInstaller"
          )

          function Download-WithRetry {
              param([string[]]$Urls, [string]$OutFile, [int]$MaxAttempts = 3)
              foreach ($url in $Urls) {
                  for ($i = 1; $i -le $MaxAttempts; $i++) {
                      Write-Host "Tentative $i/$MaxAttempts : $url"
                      try {
                          Invoke-WebRequest -Uri $url -OutFile $OutFile -UseBasicParsing `
                              -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0" `
                              -MaximumRedirection 15 -TimeoutSec 120 -ErrorAction Stop
                          if (Test-Path $OutFile) {
                              $bytes = [System.IO.File]::ReadAllBytes($OutFile)[0..1]
                              $magic = [System.Text.Encoding]::ASCII.GetString($bytes)
                              if ($magic -eq "MZ") {
                                  Write-Host "Telecharge ($((Get-Item $OutFile).Length) bytes)"
                                  return $true
                              }
                              Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                          }
                      } catch {
                          Write-Warning "Echec: $($_.Exception.Message)"
                          Start-Sleep -Seconds ([Math]::Min($i * 5, 15))
                      }
                  }
              }
              return $false
          }

          if (-not (Download-WithRetry -Urls $mirrors -OutFile $dest -MaxAttempts 3)) {
              Write-Warning "Telechargement cross-compiler impossible. 32-bit ignore."
              return
          }

          $logFile = Join-Path $env:RUNNER_TEMP "laz_cross_install.log"
          $p = Start-Process -FilePath "$dest" `
            -ArgumentList "/verysilent /suppressmsgboxes /norestart /nocloseapplications /DIR=`"$lazDir`" /LOG=`"$logFile`"" `
            -Wait -PassThru -NoNewWindow
          Write-Host "Code sortie install: $($p.ExitCode)"

          $ppc386 = Get-ChildItem -Path $lazDir -Filter "ppc386.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ppc386) {
              Write-Host "ppc386.exe OK: $($ppc386.FullName)"
              $fpcBinDir = Split-Path -Parent $ppc386.FullName
              echo "$fpcBinDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$fpcBinDir;$env:PATH"
              echo "HAVE_PPC386=true" >> $env:GITHUB_ENV
          } else {
              Write-Warning "ppc386.exe introuvable apres installation."
          }

      # ===================================================================
      # Patches d'amelioration
      # ===================================================================
      - name: Apply Cheat Engine code improvement patches
        if: ${{ inputs.apply_code_patches == true }}
        shell: pwsh
        run: |
          $ceDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine"
          $patchLog = Join-Path $env:GITHUB_WORKSPACE "patches_applied.md"
          "# Patches d'amelioration appliques" | Out-File -FilePath $patchLog -Encoding utf8
          function Add-PatchLog { param([string]$Msg) Add-Content -Path $patchLog -Value "- $Msg"; Write-Host "PATCH: $Msg" }

          $dncDir = Join-Path $ceDir "DotNetDataCollector"
          if (Test-Path $dncDir) {
              $avxHelperPath = Join-Path $dncDir "Avx2MemoryScanner.cs"
              if (-not (Test-Path $avxHelperPath)) {
                  $avxCode = @'
          using System;
          using System.Runtime.Intrinsics;
          using System.Runtime.Intrinsics.X86;
          namespace DotNetDataCollector {
              internal static class Avx2MemoryScanner {
                  public static bool IsSupported => Avx2.IsSupported;
                  public static unsafe bool ContainsPattern(byte* buffer, int length, byte pattern, byte mask) {
                      if (length <= 0) return false;
                      if (Avx2.IsSupported && length >= 32) {
                          var vPattern = Vector256.Create(pattern); var vMask = Vector256.Create(mask);
                          int i = 0, limit = length - 32;
                          while (i <= limit) {
                              var v = Avx.LoadVector256(buffer + i);
                              var masked = Avx2.And(v, vMask);
                              var cmp = Avx2.CompareEqual(masked, vPattern);
                              if (cmp.GetElement(0) != 0 || cmp.GetElement(1) != 0 || cmp.GetElement(2) != 0 || cmp.GetElement(3) != 0) return true;
                              i += 32;
                          }
                          for (; i < length; i++) if ((buffer[i] & mask) == (pattern & mask)) return true;
                          return false;
                      }
                      if (Sse2.IsSupported && length >= 16) {
                          var vPattern = Vector128.Create(pattern); var vMask = Vector128.Create(mask);
                          int i = 0, limit = length - 16;
                          while (i <= limit) {
                              var v = Sse2.LoadVector128(buffer + i);
                              var masked = Sse2.And(v, vMask);
                              var cmp = Sse2.CompareEqual(masked, vPattern);
                              if (cmp.GetElement(0) != 0 || cmp.GetElement(1) != 0) return true;
                              i += 16;
                          }
                          for (; i < length; i++) if ((buffer[i] & mask) == (pattern & mask)) return true;
                          return false;
                      }
                      for (int i = 0; i < length; i++) if ((buffer[i] & mask) == (pattern & mask)) return true;
                      return false;
                  }
                  public static unsafe int IndexOfPattern(byte* buffer, int length, byte[] pattern, byte[] mask) {
                      if (pattern == null || pattern.Length == 0 || length < pattern.Length) return -1;
                      int last = length - pattern.Length;
                      for (int i = 0; i <= last; i++) {
                          int j = 0;
                          while (j < pattern.Length && (buffer[i + j] & mask[j]) == (pattern[j] & mask[j])) j++;
                          if (j == pattern.Length) return i;
                      }
                      return -1;
                  }
              }
          }
          '@
                  $avxCode | Out-File -FilePath $avxHelperPath -Encoding utf8
                  Add-PatchLog "Ajout Avx2MemoryScanner.cs"
              }

              $csprojFiles = Get-ChildItem -Path $dncDir -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue
              foreach ($csproj in $csprojFiles) {
                  $content = Get-Content $csproj.FullName -Raw -Encoding UTF8
                  $modified = $false
                  if ($content -notmatch '<Optimize>') {
                      $content = $content -replace '</PropertyGroup>', '  <Optimize>true</Optimize>`n  <TieredCompilation>true</TieredCompilation>`n  <ServerGarbageCollection>true</ServerGarbageCollection>`n  <ConcurrentGarbageCollection>true</ConcurrentGarbageCollection>`n</PropertyGroup>'
                      $modified = $true; Add-PatchLog "$($csproj.Name): active Optimize+TieredCompilation+ServerGC"
                  }
                  if ($content -notmatch '<EnableHWIntrinsic') {
                      $content = $content -replace '</Project>', '  <PropertyGroup Condition="''$(Configuration)''==''Release''">`n    <EnableHWIntrinsic>true</EnableHWIntrinsic>`n    <AVX>true</AVX>`n  </PropertyGroup>`n</Project>'
                      $modified = $true; Add-PatchLog "$($csproj.Name): active EnableHWIntrinsic+AVX"
                  }
                  if ($modified) {
                      $content = $content -replace '`n', "`n"
                      Set-Content -Path $csproj.FullName -Value $content -Encoding UTF8 -NoNewline
                  }
              }

              $csFiles = Get-ChildItem -Path $dncDir -Filter "*.cs" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'Avx2MemoryScanner' }
              foreach ($cs in $csFiles) {
                  try {
                      $content = Get-Content $cs.FullName -Raw -Encoding UTF8; $orig = $content
                      $content = [regex]::Replace($content, 'catch\s*\(\s*Exception(\s+\w+)?\s*\)\s*\{\s*\}', 'catch (System.Exception ex$1) { System.Diagnostics.Debug.WriteLine("DotNetDataCollector: " + ex.ToString()); }')
                      $content = [regex]::Replace($content, 'catch\s*\{\s*\}', 'catch (System.Exception ex) { System.Diagnostics.Debug.WriteLine("DotNetDataCollector: " + ex.ToString()); }')
                      if ($content -ne $orig) { Set-Content -Path $cs.FullName -Value $content -Encoding UTF8 -NoNewline; Add-PatchLog "$($cs.Name): catch vides -> logging" }
                  } catch { Write-Warning "Patch catch sur $($cs.Name): $_" }
              }
          } else { Add-PatchLog "DotNetDataCollector absent" }

          $lpiFiles = Get-ChildItem -Path $ceDir -Filter "*.lpi" -Recurse -ErrorAction SilentlyContinue
          $avxModesAdded = 0
          foreach ($lpi in $lpiFiles) {
              try {
                  $content = Get-Content $lpi.FullName -Raw -Encoding UTF8
                  if ($content -match 'O4 AVX2') { continue }
                  if ($content -match '<Mode Name="Release 64-Bit">') {
                      $newMode = '    <Mode Name="Release 64-Bit O4 AVX2">' + "`n" +
                                  '      <CompilerOptions>`n' +
                                  '        <Options>`n' +
                                  '          <Optimization Value="4"/>`n' +
                                  '          <CpuType Value="AVX2"/>`n' +
                                  '        </Options>`n' +
                                  '      </CompilerOptions>`n' +
                                  '    </Mode>'
                      if ($lpi.Name -eq 'cheatengine.lpi') {
                          $content = $content -replace '(<BuildModes>)', "`$1`n$newMode"
                          Set-Content -Path $lpi.FullName -Value $content -Encoding UTF8 -NoNewline
                          $avxModesAdded++
                      }
                  }
              } catch { Write-Warning "Patch AVX2 sur $($lpi.Name): $_" }
          }
          if ($avxModesAdded -gt 0) { Add-PatchLog "Mode AVX2 ajoute a $avxModesAdded projet(s)" }

          Write-Host "::group::Resume patches"
          Get-Content $patchLog | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"

      # ===================================================================
      # Register CE Lazarus packages
      # ===================================================================
      - name: Register and Build Cheat Engine Packages
        shell: pwsh
        run: |
          $ceDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine"
          $packages = Get-ChildItem -Path $ceDir -Filter "*.lpk" -Recurse | Sort-Object Name
          Write-Host "Packages trouves: $($packages.Count)"
          foreach ($pkg in $packages) {
              Write-Host "::group::Ajout: $($pkg.Name)"
              $ok = $false
              for ($i = 1; $i -le 2; $i++) {
                  try {
                      & lazbuild --add-package "$($pkg.FullName)" 2>&1
                      if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                  } catch { }
                  Start-Sleep -Seconds 2
              }
              if (-not $ok) { Write-Warning "Echec ajout $($pkg.Name)" }
              Write-Host "::endgroup::"
          }
          & lazbuild --build-ide= 2>&1 | Out-Null

      # ===================================================================
      # Build Cheat Engine principal
      # ===================================================================
      - name: Build Cheat Engine (all release modes)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $projectPath = Join-Path $workspace "Cheat Engine\cheatengine.lpi"
          if (-not (Test-Path $projectPath)) { throw "Projet non trouve: $projectPath" }

          $criticalModes = @("Release 64-Bit", "Release 64-Bit O4 AVX2")
          $optionalModes = @()
          if ($env:HAVE_PPC386 -eq "true") { $optionalModes += "Release 32-Bit" }

          foreach ($mode in $criticalModes) {
              Write-Host "::group::Compilation CRITIQUE: $mode"
              & lazbuild --build-mode="$mode" --max-process-count=4 "$projectPath" 2>&1
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($exitCode -ne 0) {
                  if ($mode -like "*AVX2*") { Write-Warning "Mode AVX2 echoue (non-fatal)" }
                  else { throw "Mode CRITIQUE '$mode' echoue (code $exitCode)" }
              }
          }
          foreach ($mode in $optionalModes) {
              Write-Host "::group::Compilation OPTIONNEL: $mode"
              & lazbuild --build-mode="$mode" --max-process-count=4 "$projectPath" 2>&1
              if ($LASTEXITCODE -ne 0) { Write-Warning "Mode OPTIONNEL '$mode' echoue" }
              Write-Host "::endgroup::"
          }
          exit 0

      # ===================================================================
      # Build DotNetDataCollector — x64 (dotnet CLI)
      # ===================================================================
      - name: Build DotNetDataCollector (x64)
        shell: pwsh
        run: |
          $dncDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\DotNetDataCollector"
          if (-not (Test-Path $dncDir)) { Write-Warning "DNC absent"; exit 0 }
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnet) { Write-Warning "dotnet absent"; exit 0 }

          $proj = Get-ChildItem -Path $dncDir -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proj) { Write-Warning "Aucun .csproj DNC"; exit 0 }

          Write-Host "::group::dotnet restore + build DNC x64"
          & dotnet restore $proj.FullName 2>&1
          & dotnet build $proj.FullName -c Release -r win-x64 --self-contained false -p:Platform=x64 --no-restore 2>&1
          Write-Host "Exit code x64: $LASTEXITCODE"
          Write-Host "::endgroup::"

          $binDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          $searchRoots = @($dncDir)
          foreach ($root in $searchRoots) {
              Get-ChildItem -Path $root -Recurse -Include "DotNetDataCollector*.dll","DotNetDataCollector*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                  Copy-Item $_.FullName -Destination $binDir -Force -ErrorAction SilentlyContinue
                  Write-Host "Copie DNC x64: $($_.Name) -> bin"
              }
          }
          exit 0

      # ===================================================================
      # Build DotNetDataCollector — x86
      # ===================================================================
      - name: Build DotNetDataCollector (x86)
        shell: pwsh
        run: |
          $dncDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\DotNetDataCollector"
          if (-not (Test-Path $dncDir)) { exit 0 }
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnet) { exit 0 }

          $proj = Get-ChildItem -Path $dncDir -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proj) { exit 0 }

          Write-Host "::group::dotnet build DNC x86"
          & dotnet build $proj.FullName -c Release -r win-x86 --self-contained false -p:Platform=x86 2>&1
          Write-Host "Exit code x86: $LASTEXITCODE"
          Write-Host "::endgroup::"

          $binX86 = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\bin\x86"
          New-Item -ItemType Directory -Path $binX86 -Force | Out-Null
          Get-ChildItem -Path $dncDir -Recurse -Include "DotNetDataCollector*.dll","DotNetDataCollector*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination $binX86 -Force -ErrorAction SilentlyContinue
              Write-Host "Copie DNC x86: $($_.Name)"
          }
          exit 0

      # ===================================================================
      # Build DotNetDataCollector — AVX variant
      # ===================================================================
      - name: Build DotNetDataCollector (AVX variant)
        if: ${{ inputs.enable_avx == true }}
        shell: pwsh
        run: |
          $dncDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\DotNetDataCollector"
          if (-not (Test-Path $dncDir)) { exit 0 }
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnet) { exit 0 }

          $proj = Get-ChildItem -Path $dncDir -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proj) { exit 0 }

          Write-Host "::group::dotnet build DNC AVX"
          & dotnet build $proj.FullName -c Release -r win-x64 --self-contained false `
              -p:Platform=x64 -p:DefineConstants="AVX;AVX2" -p:Optimize=true -p:TieredCompilation=true -p:AVX=true 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Warning "AVX build echoue"; exit 0 }
          Write-Host "::endgroup::"

          $binAvx = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\bin\avx"
          New-Item -ItemType Directory -Path $binAvx -Force | Out-Null
          Get-ChildItem -Path $dncDir -Recurse -Include "DotNetDataCollector*.dll","DotNetDataCollector*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              $destName = $_.BaseName + ".avx" + $_.Extension
              Copy-Item $_.FullName -Destination (Join-Path $binAvx $destName) -Force
              Write-Host "Copie DNC AVX: $destName"
          }
          exit 0

      # ===================================================================
      # Build Lazarus sub-projects
      # ===================================================================
      - name: Build Lazarus sub-projects
        shell: pwsh
        run: |
          $ceDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine"
          $subDirs = @("speedhack","luaclient","VEHDebug","Tutorial","betterControls","plugin","launcher","winhook","xmplayer")

          foreach ($sub in $subDirs) {
              $p = Join-Path $ceDir $sub
              if (-not (Test-Path $p)) { continue }
              $lpiFiles = Get-ChildItem -Path $p -Filter "*.lpi" -Recurse -ErrorAction SilentlyContinue
              foreach ($lpi in $lpiFiles) {
                  Write-Host "::group::lazbuild $($lpi.Name) [64-bit]"
                  & lazbuild --build-mode="Release" --cpu=x86_64 --os=win64 --ws=win32 --max-process-count=4 "$($lpi.FullName)" 2>&1
                  if ($LASTEXITCODE -ne 0) { Write-Warning "Echec $($lpi.Name) [64-bit]" }
                  Write-Host "::endgroup::"
              }
              $lprFiles = Get-ChildItem -Path $p -Filter "*.lpr" -Recurse -ErrorAction SilentlyContinue
              foreach ($lpr in $lprFiles) {
                  Write-Host "::group::lazbuild $($lpr.Name) [64-bit]"
                  & lazbuild --cpu=x86_64 --os=win64 --ws=win32 --max-process-count=4 "$($lpr.FullName)" 2>&1
                  if ($LASTEXITCODE -ne 0) { Write-Warning "Echec $($lpr.Name) [64-bit]" }
                  Write-Host "::endgroup::"
              }
          }

          if ($env:HAVE_PPC386 -eq "true") {
              Write-Host ">> Compilation 32-bit"
              foreach ($sub in $subDirs) {
                  $p = Join-Path $ceDir $sub
                  if (-not (Test-Path $p)) { continue }
                  Get-ChildItem -Path $p -Filter "*.lpi" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                      Write-Host "::group::lazbuild $($_.Name) [32-bit]"
                      & lazbuild --build-mode="Release" --cpu=i386 --os=win32 --ws=win32 --max-process-count=4 "$($_.FullName)" 2>&1
                      Write-Host "::endgroup::"
                  }
              }
          }
          exit 0

      # ===================================================================
      # Restore NuGet pour toutes les solutions .NET
      # ===================================================================
      - name: Restore NuGet packages (all .NET solutions)
        shell: pwsh
        run: |
          $ceDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine"
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnet) { Write-Warning "dotnet absent"; exit 0 }

          $netSolutions = @(
              "DotNetDataCollector.sln",
              "DotNetInvasiveDataCollector.sln",
              "MonoDataCollector.sln",
              "CEJVMTI.sln",
              "CSCompiler.sln"
          )
          foreach ($solName in $netSolutions) {
              $solPath = Get-ChildItem -Path $ceDir -Filter $solName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($solPath) {
                  Write-Host "::group::nuget restore $solName"
                  & dotnet restore "$($solPath.FullName)" 2>&1
                  Write-Host "Restore $solName exit: $LASTEXITCODE"
                  Write-Host "::endgroup::"
              } else {
                  Write-Warning "$solName introuvable"
              }
          }
          exit 0

      # ===================================================================
      # Build Visual Studio sub-projects + collecte immediate des outputs
      # ===================================================================
      - name: Build Visual Studio sub-projects (.sln) + collect outputs
        shell: pwsh
        run: |
          $ceDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine"
          $binDir = Join-Path $ceDir "bin"
          $artifactsDir = Join-Path $binDir "artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null

          # Definition: Nom, Plateformes, EstNet, Critique
          $solutions = @(
              @{ Name="DotNetDataCollector.sln";         Platforms=@("x86","x64"); IsNet=$true;  Critical=$false },
              @{ Name="DotNetInvasiveDataCollector.sln"; Platforms=@("Any CPU");   IsNet=$true;  Critical=$false },
              @{ Name="MonoDataCollector.sln";           Platforms=@("x86","x64"); IsNet=$true;  Critical=$false },
              @{ Name="CEJVMTI.sln";                     Platforms=@("x86","x64"); IsNet=$true;  Critical=$false },
              @{ Name="Direct x mess.sln";               Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="CSCompiler.sln";                  Platforms=@("Any CPU");   IsNet=$true;  Critical=$false },
              @{ Name="tcc.sln";                         Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="dbkkernel.sln";                   Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="cudaPointerScan.sln";             Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="lua53.sln";                       Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="CEPluginLibrary.sln";             Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="example-c.sln";                   Platforms=@("x86","x64"); IsNet=$false; Critical=$false },
              @{ Name="QWS.sln";                         Platforms=@("x86","x64"); IsNet=$false; Critical=$false }
          )

          foreach ($sol in $solutions) {
              $solPath = Get-ChildItem -Path $ceDir -Filter $sol.Name -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $solPath) {
                  Write-Warning "$($sol.Name) introuvable - SKIP"
                  continue
              }

              $solBase = [System.IO.Path]::GetFileNameWithoutExtension($solPath.Name)
              Write-Host "::group::msbuild $($sol.Name)"

              foreach ($plat in $sol.Platforms) {
                  $msbuildPlat = if ($plat -eq "Any CPU") { "AnyCPU" } else { $plat }
                  Write-Host "--- Plateforme: $plat ---"

                  & msbuild "$($solPath.FullName)" `
                      /nologo /verbosity:minimal `
                      /p:Configuration=Release `
                      /p:Platform="$msbuildPlat" 2>&1
                  $exit = $LASTEXITCODE

                  if ($exit -ne 0) {
                      if ($sol.Critical) { throw "CRITIQUE ECHOUE: $($sol.Name) [$plat]" }
                      else { Write-Warning "NON-CRITIQUE ECHOUE: $($sol.Name) [$plat] (code $exit)" }
                      continue
                  }

                  # --- COLLECTE DES OUTPUTS ---
                  $solFolder = $solPath.DirectoryName
                  $destFolder = Join-Path $artifactsDir "$solBase\$plat"
                  New-Item -ItemType Directory -Path $destFolder -Force | Out-Null

                  # Patterns de sortie classiques VS
                  $searchPatterns = @(
                      (Join-Path $solFolder "bin\$msbuildPlat\Release\*"),
                      (Join-Path $solFolder "bin\Release\*"),
                      (Join-Path $solFolder "bin\x64\Release\*"),
                      (Join-Path $solFolder "bin\x86\Release\*"),
                      (Join-Path $solFolder "$solBase\bin\$msbuildPlat\Release\*"),
                      (Join-Path $solFolder "$solBase\bin\Release\*"),
                      (Join-Path $solFolder "x64\Release\*"),
                      (Join-Path $solFolder "x86\Release\*"),
                      (Join-Path $solFolder "Release\*"),
                      (Join-Path $solFolder "obj\$msbuildPlat\Release\*"),
                      (Join-Path $solFolder "obj\Release\*")
                  )

                  $copied = 0
                  foreach ($pattern in $searchPatterns) {
                      if (Test-Path $pattern) {
                          Get-ChildItem -Path $pattern -Include "*.dll","*.exe","*.pdb","*.lib" -ErrorAction SilentlyContinue | ForEach-Object {
                              try {
                                  Copy-Item $_.FullName -Destination $destFolder -Force
                                  Write-Host "  [COLLECT] $($_.Name) -> artifacts/$solBase/$plat/"
                                  $copied++
                              } catch { Write-Warning "  Echec copie $($_.Name): $_" }
                          }
                      }
                  }

                  # Fallback: recherche recursive dans le dossier de la solution
                  if ($copied -eq 0) {
                      Write-Host "  Fallback recherche recursive dans $($solPath.DirectoryName)..."
                      Get-ChildItem -Path $solFolder -Recurse -Include "*.dll","*.exe" -ErrorAction SilentlyContinue |
                          Where-Object { $_.FullName -match '\\(bin|obj)\\' -and $_.FullName -match 'Release' } |
                          ForEach-Object {
                              try {
                                  Copy-Item $_.FullName -Destination $destFolder -Force
                                  Write-Host "  [COLLECT-FB] $($_.Name)"
                                  $copied++
                              } catch { }
                          }
                  }
                  Write-Host "  -> $copied fichier(s) collecte(s) pour $solBase [$plat]"
              }
              Write-Host "::endgroup::"
          }
          exit 0

      # ===================================================================
      # Copier tcclib DLLs
      # ===================================================================
      - name: Copy tcclib DLLs to bin
        shell: pwsh
        run: |
          $tcclibOut = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\tcclib") -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "tcclib" }
          if ($tcclibOut) {
              $binDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\bin"
              foreach ($dll in $tcclibOut) {
                  Copy-Item $dll.FullName -Destination $binDir -Force -ErrorAction SilentlyContinue
                  Write-Host "Copie $($dll.Name) -> bin"
              }
          }
          exit 0

      # ===================================================================
      # Collecte Lazarus outputs (DLLs/EXEs des sous-projets)
      # ===================================================================
      - name: Collect Lazarus sub-project outputs
        shell: pwsh
        run: |
          $ceDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine"
          $binDir = Join-Path $ceDir "bin"
          $lazDir = Join-Path $binDir "lazarus-projects"
          New-Item -ItemType Directory -Path $lazDir -Force | Out-Null

          $subDirs = @("speedhack","luaclient","VEHDebug","Tutorial","betterControls","plugin","launcher","winhook","xmplayer")
          foreach ($sub in $subDirs) {
              $p = Join-Path $ceDir $sub
              if (-not (Test-Path $p)) { continue }
              Get-ChildItem -Path $p -Recurse -Include "*.dll","*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                  $rel = $_.FullName.Substring($p.Length + 1)
                  $destFolder = Join-Path $lazDir $sub
                  New-Item -ItemType Directory -Path $destFolder -Force | Out-Null
                  Copy-Item $_.FullName -Destination $destFolder -Force
                  Write-Host "[LAZARUS] $sub/$rel -> lazarus-projects/$sub/"
              }
          }
          exit 0

      # ===================================================================
      # Checksums + manifeste
      # ===================================================================
      - name: Generate SHA256 checksums and build manifest
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\bin"
          if (-not (Test-Path $binDir)) { Write-Warning "bin introuvable"; exit 0 }

          $manifest = Join-Path $env:GITHUB_WORKSPACE "build_manifest.txt"
          "Cheat Engine Build Manifest" | Out-File -FilePath $manifest -Encoding utf8
          "Generated: $(Get-Date -Format 'o')" | Out-File -FilePath $manifest -Append -Encoding utf8
          "Repository: ${{ inputs.repository }}" | Out-File -FilePath $manifest -Append -Encoding utf8
          "Ref: ${{ inputs.ref }}" | Out-File -FilePath $manifest -Append -Encoding utf8
          "Lazarus: ${{ inputs.lazarus_version }}" | Out-File -FilePath $manifest -Append -Encoding utf8
          ".NET: ${{ inputs.dotnet_version }}" | Out-File -FilePath $manifest -Append -Encoding utf8
          "AVX: ${{ inputs.enable_avx }}" | Out-File -FilePath $manifest -Append -Encoding utf8
          "Patches: ${{ inputs.apply_code_patches }}" | Out-File -FilePath $manifest -Append -Encoding utf8
          "" | Out-File -FilePath $manifest -Append -Encoding utf8
          "Files:" | Out-File -FilePath $manifest -Append -Encoding utf8

          $hashes = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS.txt"
          Get-ChildItem -Path $binDir -Recurse -File | Sort-Object FullName | ForEach-Object {
              $rel = $_.FullName.Substring($binDir.Length + 1).Replace('\','/')
              $sha = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "{0} *{1}" -f $sha, $rel | Out-File -FilePath $hashes -Append -Encoding utf8
              "  {0,-60} {1,12} bytes  sha256:{2}" -f $rel, $_.Length, $sha.Substring(0,12) | Out-File -FilePath $manifest -Append -Encoding utf8
          }
          Copy-Item $manifest -Destination $binDir -Force
          Copy-Item $hashes -Destination $binDir -Force
          exit 0

      # ===================================================================
      # Resume final + Step Summary
      # ===================================================================
      - name: List final bin folder + write GitHub Step Summary
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "Cheat Engine\bin"
          $summary = $env:GITHUB_STEP_SUMMARY
          if (-not $summary) { $summary = Join-Path $env:GITHUB_WORKSPACE "summary.md" }

          "# Cheat Engine - Build Summary" | Out-File -FilePath $summary -Encoding utf8
          "" | Out-File -FilePath $summary -Append -Encoding utf8
          "- Repo: ``${{ inputs.repository }}`` / ``${{ inputs.ref }}``" | Out-File -FilePath $summary -Append -Encoding utf8
          "- Lazarus: ``${{ inputs.lazarus_version }}`` | .NET: ``${{ inputs.dotnet_version }}``" | Out-File -FilePath $summary -Append -Encoding utf8
          "- AVX: ``${{ inputs.enable_avx }}`` | Patches: ``${{ inputs.apply_code_patches }}`` | ppc386: ``$($env:HAVE_PPC386 -eq 'true')``" | Out-File -FilePath $summary -Append -Encoding utf8
          "" | Out-File -FilePath $summary -Append -Encoding utf8
          "## Binaires generes" | Out-File -FilePath $summary -Append -Encoding utf8
          "" | Out-File -FilePath $summary -Append -Encoding utf8
          "| Fichier | Taille |" | Out-File -FilePath $summary -Append -Encoding utf8
          "|---------|--------|" | Out-File -FilePath $summary -Append -Encoding utf8

          if (Test-Path $binDir) {
              Get-ChildItem -Path $binDir -Recurse -File | Sort-Object FullName | ForEach-Object {
                  $rel = $_.FullName.Substring($binDir.Length + 1).Replace('\','/')
                  "| $rel | $($_.Length) |" | Out-File -FilePath $summary -Append -Encoding utf8
              }
          }

      # ===================================================================
      # Artifacts upload
      # ===================================================================
      - name: Upload artifact (main)
        uses: actions/upload-artifact@v4
        with:
          name: cheat-engine-win64-${{ inputs.ref || 'master' }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload VS sub-projects artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vs-subprojects-${{ inputs.ref || 'master' }}
          path: |
            Cheat Engine/bin/artifacts/**
            Cheat Engine/bin/lazarus-projects/**
            Cheat Engine/bin/build_manifest.txt
            Cheat Engine/bin/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DotNetDataCollector artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnetdatacollector-multiarch-${{ inputs.ref || 'master' }}
          path: |
            Cheat Engine/bin/DotNetDataCollector*
            Cheat Engine/bin/x86/DotNetDataCollector*
            Cheat Engine/bin/avx/DotNetDataCollector*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload patches log
        if: ${{ inputs.apply_code_patches == true }}
        uses: actions/upload-artifact@v4
        with:
          name: patches-applied-${{ inputs.ref || 'master' }}
          path: patches_applied.md
          if-no-files-found: warn
          retention-days: 14
