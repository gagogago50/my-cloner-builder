name: Build & Security Scan Template

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'owner/repo du projet source à builder/scanner'
        type: string
        required: true
      ref:
        description: 'Branche, tag ou SHA à builder/scanner'
        type: string
        default: 'main'
      project_type:
        description: 'Type de build à exécuter'
        type: choice
        options:
          - windows
          - android
          - none   # scans uniquement, pas de build
        default: 'none'
      version:
        description: 'Forcer une version (laisser vide pour auto-détection)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD — WINDOWS (à adapter par projet : cargo, msys2, msvc, etc.)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: "🏗️ Build Windows"
    if: ${{ inputs.project_type == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # nécessaire pour git describe / détection de version

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version résolue : $VERSION"

      # ─── EXEMPLE A : projet Rust (adapter target/toolchain) ─────────────────
      # - uses: dtolnay/rust-toolchain@stable
      #   with:
      #     targets: x86_64-pc-windows-msvc
      # - name: Build
      #   run: cargo build --release --target x86_64-pc-windows-msvc

      # ─── EXEMPLE B : projet C/C++ via MSYS2 (adapter script/Makefile) ───────
      # - uses: msys2/setup-msys2@v2
      #   with:
      #     msystem: CLANG64
      #     path-type: inherit
      #     install: mingw-w64-clang-x86_64-clang make zip
      # - name: Build
      #   shell: msys2 {0}
      #   run: |
      #     scripts/build.sh --version "$VERSION" CC=clang CXX=clang++

      # ─── EXEMPLE C : projet Node/Electron ───────────────────────────────────
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      # - run: npm ci && npm run build:win

      - name: Verify build output exists
        shell: bash
        run: |
          echo "::warning::Étape de build à personnaliser pour ce projet — voir commentaires dans le YAML"
          # exit 1  # décommente une fois le vrai build en place

      # - name: Package binary
      #   shell: bash
      #   run: |
      #     zip -r "app-${VERSION}-windows.zip" dist/
      #
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: windows-build
      #     path: "*.zip"

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD — ANDROID (Gradle, à adapter au module/flavor du projet)
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: "🏗️ Build Android"
    if: ${{ inputs.project_type == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version résolue : $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ─── Build debug APK (aucun secret requis) ──────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ─── Build release APK signé (nécessite un keystore en secret) ─────────
      # - name: Decode keystore
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      # - name: Build release APK
      #   run: |
      #     ./gradlew assembleRelease \
      #       -Pandroid.injected.signing.store.file=../keystore.jks \
      #       -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
      #       -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
      #       -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Locate APK
        run: find . -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ env.VERSION }}
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn

───────────────────────────────────────────────────────────────────────────
  # JOB 2 : CLAMAV (NOUVEAU - Scan Malwares & Signatures suspectes)
  # ───────────────────────────────────────────────────────────────────────────
  clamav:
    name: "🦠 ClamAV – Malware & Stealer Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - name: Install ClamAV & Update Signatures
        run: |
          sudo apt-get update && sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "Freshclam failed, using default database."

      - name: Scan Repository
        run: |
          clamscan -r -i . > clamav-report.txt || true

      - name: Upload ClamAV Report
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.txt

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 : SEMGREP
  # ───────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔎 Semgrep – Code Patterns & Obfuscation"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/secrets" --config "p/security-audit" --sarif --output semgrep.sarif . || true

      # Upload en tant qu'artifact au lieu d'utiliser l'API GitHub Security
      - name: Upload Semgrep SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 : GUARDDOG
  # ───────────────────────────────────────────────────────────────────────────
  guarddog:
    name: "🐕 GuardDog – Malicious Packages"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run GuardDog Scans
        run: |
          pip install guarddog
          for f in $(find . -name "requirements*.txt" -not -path "*/node_modules/*" 2>/dev/null); do
            guarddog pypi verify "$f" --output-format json > "guarddog-pypi-$(basename "$f").json" 2>&1 || true
          done
          for f in $(find . -name "package.json" -not -path "*/node_modules/*" 2>/dev/null); do
            guarddog npm verify "$f" --output-format json > "guarddog-npm-$(basename "$f").json" 2>&1 || true
          done

      - name: Upload GuardDog results
        uses: actions/upload-artifact@v4
        with:
          name: guarddog-results
          path: guarddog-*.json
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 : CODEQL (Corrigé pour éviter l'erreur commit)
  # ───────────────────────────────────────────────────────────────────────────
  codeql:
    name: "🧬 CodeQL – Analysis"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        language: [ 'javascript-typescript', 'python', 'go' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '>=1.21'
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          
      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis (Sans upload automatique)
        uses: github/codeql-action/analyze@v3
        with:
          upload: never # EMPÊCHE L'ERREUR DE COMMIT API
          output: codeql-results-${{ matrix.language }}

      - name: Upload CodeQL Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report-${{ matrix.language }}
          path: codeql-results-${{ matrix.language }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6 : GITLEAKS
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: "🔑 Gitleaks – Secrets"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 7 : BEARER
  # ───────────────────────────────────────────────────────────────────────────
  bearer:
    name: "🛡️ Bearer – SAST & Secrets"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}

      - name: Run Bearer scan
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          bearer scan . --format sarif --output bearer.sarif --severity critical,high,medium --scanner secrets --quiet || true

      # Upload en tant qu'artifact au lieu d'utiliser l'API GitHub Security
      - name: Upload Bearer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bearer-report
          path: bearer.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB FINAL : SUMMARY
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "📋 Security & Build Summary"
    runs-on: ubuntu-latest
    needs: [ build-mcp-agent, clamav, semgrep, guarddog, codeql, gitleaks, bearer ]
    if: always()
    steps:
      - name: Write Job Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🔒 Build & Security Report

          | Job | Statut |
          |-----|--------|
          | 🏗️ Build Windows AMD64   | ${{ needs.build-mcp-agent.result }} |
          | 🦠 ClamAV (Malware)      | ${{ needs.clamav.result }} |
          | 🔎 Semgrep               | ${{ needs.semgrep.result }} |
          | 🐕 GuardDog             | ${{ needs.guarddog.result }} |
          | 🧬 CodeQL               | ${{ needs.codeql.result }} |
          | 🔑 Gitleaks             | ${{ needs.gitleaks.result }} |
          | 🛡️ Bearer                | ${{ needs.bearer.result }} |
          
          ℹ️ **Note:** Les rapports de sécurité détaillés (fichiers .sarif et .txt) sont téléchargeables dans la section "Artifacts" ci-dessous.
          EOF
