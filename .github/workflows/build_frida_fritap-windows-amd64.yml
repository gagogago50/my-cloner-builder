name: Remote build - friTap Windows AMD64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FRIDA_VERSION: "17.17.0"
  FRIDA_COMMIT: "03f16b3b11c5bb945cdb7f6158a84dd57655de4c"
  FRITAP_COMMIT: "021399a76f235e7d30e1f17ad104db2e6d784934"
  OPENSSL_VERSION: "3.6.0"
  OPENSSL_COMMIT: "7b371d80d959ec9ab4139d09d78e83c090de9779"
  NUITKA_VERSION: "4.1.3"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build everything remotely
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install deterministic Python build front-end
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==25.3" "setuptools==80.9.0" "wheel==0.45.1"

      - name: Clone immutable Frida source
        shell: pwsh
        run: |
          git clone --branch $env:FRIDA_VERSION --depth 1 `
            --recurse-submodules --shallow-submodules `
            https://github.com/frida/frida.git frida-source
          if ($LASTEXITCODE -ne 0) { throw "Frida clone failed" }
          $actual = (git -C frida-source rev-parse HEAD).Trim()
          if ($actual -ne $env:FRIDA_COMMIT) {
            throw "Unexpected Frida commit: $actual"
          }
          $bad = git -C frida-source submodule status --recursive |
            Where-Object { $_ -match '^[+-]' }
          if ($bad) { throw "Frida submodule checkout mismatch" }

      - name: Configure Frida and build linked SDK dependencies from source
        shell: pwsh
        working-directory: frida-source
        run: |
          $env:FRIDA_PREFIX = "$env:RUNNER_TEMP\frida-prefix"
          "FRIDA_PREFIX=$env:FRIDA_PREFIX" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          .\configure.bat `
            --prefix="$env:FRIDA_PREFIX" `
            --host=windows-x86_64 `
            --without-prebuilds=sdk `
            --disable-gadget `
            --disable-server `
            --disable-inject `
            --disable-frida-tools `
            --disable-graft-tool `
            --enable-frida-python `
            -- `
            "-Dfrida-core:compiler_backend=disabled" `
            "-Dfrida-core:fruity_backend=disabled"
          if ($LASTEXITCODE -ne 0) { throw "Frida configure failed" }

      - name: Compile Frida
        shell: pwsh
        working-directory: frida-source
        run: |
          .\make.bat
          if ($LASTEXITCODE -ne 0) { throw "Frida compilation failed" }
          .\make.bat install
          if ($LASTEXITCODE -ne 0) { throw "Frida installation failed" }

      - name: Package and test the source-built Frida wheel
        shell: pwsh
        working-directory: frida-source/subprojects/frida-python
        run: |
          $env:FRIDA_VERSION = "17.17.0"
          $env:FRIDA_EXTENSION = "$env:FRIDA_PREFIX\lib\site-packages\frida\_frida.pyd"
          if (-not (Test-Path $env:FRIDA_EXTENSION)) {
            throw "Source-built _frida.pyd was not produced"
          }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          python -m pip wheel --no-deps --no-build-isolation `
            --wheel-dir "$env:GITHUB_WORKSPACE\artifacts" .
          if ($LASTEXITCODE -ne 0) { throw "Frida wheel packaging failed" }

          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\frida-17.17.0-cp37-abi3-win_amd64.whl" |
            Select-Object -First 1
          if (-not $wheel) { throw "Expected Frida ABI3 AMD64 wheel not found" }
          python -m pip install --no-index --no-deps `
            --find-links="$env:GITHUB_WORKSPACE\artifacts" "frida==17.17.0"
          python -c "import frida; assert frida.__version__ == '17.17.0'"

      - name: Delete Frida source tree to free runner space
        shell: pwsh
        run: Remove-Item -Recurse -Force frida-source

      - name: Clone immutable friTap source
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/fkie-cad/friTap.git fritap-source
          git -C fritap-source checkout --detach $env:FRITAP_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "friTap checkout failed" }
          $actual = (git -C fritap-source rev-parse HEAD).Trim()
          if ($actual -ne $env:FRITAP_COMMIT) {
            throw "Unexpected friTap commit: $actual"
          }
          Remove-Item -Recurse -Force fritap-source\.git

      - name: Apply hardened remote-build policy
        shell: pwsh
        working-directory: fritap-source
        run: |
          # Remove opaque Android/test binaries; they are irrelevant on Windows.
          Remove-Item -Recurse -Force "friTap/assets/tcpdump_binaries" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "assets/tcpdump_binaries" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "ground_truth" -ErrorAction SilentlyContinue
          Remove-Item -Force "readmod.bin", "writemod.bin" -ErrorAction SilentlyContinue

          # Disable ambient external Python code unless the operator explicitly
          # sets FRITAP_ENABLE_EXTERNAL_EXTENSIONS=1 before launching friTap.
          @'
          from pathlib import Path

          entry = Path("friTap.py")
          text = entry.read_text(encoding="utf-8")
          marker = "from friTap.friTap import main"
          prefix = '''import os

          if os.environ.get("FRITAP_ENABLE_EXTERNAL_EXTENSIONS", "").lower() not in {"1", "true", "yes", "on"}:
              os.environ.setdefault("FRITAP_DISABLE_ANALYZER_DISCOVERY", "1")
              os.environ.setdefault("FRITAP_DISABLE_PARSER_DISCOVERY", "1")
              os.environ.setdefault("FRITAP_DISABLE_OFFLINE_DECRYPTOR_DISCOVERY", "1")

          '''
          if marker not in text:
              raise SystemExit("friTap entry-point marker not found")
          entry.write_text(text.replace(marker, prefix + marker, 1), encoding="utf-8")

          loader = Path("friTap/plugins/loader.py")
          text = loader.read_text(encoding="utf-8")
          text = text.replace("import logging\n", "import logging\nimport os\n", 1)
          needle = '    def discover(self) -> List[str]:\n        """Discover available plugins from all sources."""\n'
          replacement = needle + '        if os.environ.get("FRITAP_ENABLE_EXTERNAL_EXTENSIONS", "").lower() not in {"1", "true", "yes", "on"}:\n            return []\n'
          if needle not in text:
              raise SystemExit("Plugin loader marker not found")
          loader.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Hardening patch failed" }

      - name: Resolve and hash-lock latest compatible Python dependencies
        shell: pwsh
        working-directory: fritap-source
        run: |
          python -m pip install "pip-tools==7.5.2"
          New-Item -ItemType Directory -Force constraints | Out-Null
          pip-compile requirements.txt --resolver=backtracking --generate-hashes `
            --allow-unsafe --strip-extras `
            --output-file constraints\windows-amd64-py311.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency lock generation failed" }

      - name: Build OpenSSL from immutable source
        shell: pwsh
        run: |
          $vsDevShell = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1"
          & $vsDevShell -Arch amd64 -HostArch amd64
          git clone --depth 1 --branch "openssl-$env:OPENSSL_VERSION" `
            https://github.com/openssl/openssl.git openssl-source
          $actual = (git -C openssl-source rev-parse HEAD).Trim()
          if ($actual -ne $env:OPENSSL_COMMIT) {
            throw "Unexpected OpenSSL commit: $actual"
          }
          Push-Location openssl-source
          perl Configure VC-WIN64A no-shared no-tests `
            --prefix="$env:RUNNER_TEMP\openssl-local" `
            --openssldir="$env:RUNNER_TEMP\openssl-local\ssl"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL configure failed" }
          nmake /S
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed" }
          nmake /S install_sw
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL install failed" }
          Pop-Location
          Remove-Item -Recurse -Force openssl-source

      - name: Compile native Python dependencies from source
        shell: pwsh
        working-directory: fritap-source
        run: |
          $env:OPENSSL_DIR = "$env:RUNNER_TEMP\openssl-local"
          $env:OPENSSL_STATIC = "1"

          # Install only the Frida wheel built in this workflow.
          python -m pip install --no-index --no-deps `
            --find-links="$env:GITHUB_WORKSPACE\artifacts" "frida==17.17.0"

          $sourcePackages = @(
            "brotli", "cffi", "cryptography", "psutil", "pydantic-core",
            "pylsqpack", "tgcrypto-pyrofork", "watchdog", "zstandard"
          )
          $noBinary = $sourcePackages -join ","
          python -m pip install --require-hashes "--no-binary=$noBinary" `
            -r constraints\windows-amd64-py311.lock
          if ($LASTEXITCODE -ne 0) { throw "Native source build failed" }
          python -m pip check
          python -m pip freeze --all | Sort-Object |
            Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\artifacts\requirements-resolved.txt"

      - name: Install Nuitka from verified source distribution
        shell: pwsh
        working-directory: fritap-source
        run: |
          python -m pip download --no-deps --no-binary=:all: `
            --dest "$env:RUNNER_TEMP\nuitka-source" "Nuitka==$env:NUITKA_VERSION"
          $archive = Get-ChildItem "$env:RUNNER_TEMP\nuitka-source\nuitka-4.1.3.tar.gz"
          $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "838ff8899dc2f0b652d4fcf6c5d7466cb7ad5abcb005668ac622d1e40f4d8a8d") {
            throw "Nuitka source hash mismatch"
          }
          python -m pip install --no-deps $archive.FullName
          python -m nuitka --version

      - name: Compile friTap with Nuitka
        shell: pwsh
        working-directory: fritap-source
        run: |
          python friTap.py --help | Out-Null
          python -m nuitka `
            --mode=standalone `
            --msvc=latest `
            --disable-ccache `
            --windows-console-mode=force `
            --output-dir=dist `
            --output-filename=fritap.exe `
            --include-package=friTap `
            --include-package-data=friTap `
            --nofollow-import-to=tkinter `
            friTap.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka build failed" }

      - name: Verify and create downloadable files
        shell: pwsh
        working-directory: fritap-source
        run: |
          $out = Get-ChildItem dist -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $out) { throw "Nuitka output directory not found" }
          $exe = Join-Path $out.FullName "fritap.exe"
          if (-not (Test-Path $exe)) { throw "fritap.exe not found" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Compiled executable smoke test failed" }

          $forbidden = Get-ChildItem $out.FullName -Recurse -File |
            Where-Object { $_.Name -like "tcpdump_*_android" }
          if ($forbidden) { throw "Forbidden Android binary found" }

          Get-ChildItem $out.FullName -Recurse -File | Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($out.FullName.Length + 1)
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Out-File -Encoding ascii "$env:GITHUB_WORKSPACE\artifacts\FRITAP-SHA256SUMS.txt"

          Compress-Archive -Path "$($out.FullName)\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\artifacts\fritap-windows-amd64-nuitka.zip" -Force
          Get-FileHash "$env:GITHUB_WORKSPACE\artifacts\fritap-windows-amd64-nuitka.zip" -Algorithm SHA256 |
            Format-List | Out-File "$env:GITHUB_WORKSPACE\artifacts\FRITAP-ZIP-SHA256.txt"

      - name: Upload downloads to GitHub Actions artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fritap-windows-amd64-complete
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
