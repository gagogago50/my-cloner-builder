name: Build hardened Windows AMD64 with Nuitka

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  build-windows-amd64:
    name: Windows AMD64 (hardened)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            constraints/windows-amd64-py311.lock
            constraints/windows-amd64-build.lock

      - name: Remove non-Windows prebuilt artifacts
        shell: pwsh
        run: |
          # Android tcpdump and historical PE test clients are not required for
          # a Windows desktop build and have no reproducible provenance here.
          Remove-Item -Recurse -Force "friTap/assets/tcpdump_binaries" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "assets/tcpdump_binaries" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "ground_truth" -ErrorAction SilentlyContinue
          Remove-Item -Force "readmod.bin", "writemod.bin" -ErrorAction SilentlyContinue

      - name: Download dependency source archives for provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dependency-sources | Out-Null
          $pins = Select-String -Path `
                    "constraints/windows-amd64-py311.lock", `
                    "constraints/windows-amd64-build.lock" `
                    -Pattern '^([A-Za-z0-9_.-]+)==([^ ;\\]+)' |
                  ForEach-Object { "$($_.Matches[0].Groups[1].Value)==$($_.Matches[0].Groups[2].Value)" } |
                  Sort-Object -Unique
          $missing = @()
          foreach ($pin in $pins) {
            $parts = $pin -split '==', 2
            $name = $parts[0]
            $version = $parts[1]
            try {
              # Query metadata and fetch the sdist directly. Unlike `pip
              # download`, this does not execute an untrusted PEP-517 backend.
              $meta = Invoke-RestMethod -Uri "https://pypi.org/pypi/$name/$version/json"
              $sdist = $meta.urls | Where-Object { $_.packagetype -eq 'sdist' } | Select-Object -First 1
              if (-not $sdist) { throw "no sdist published" }
              $dest = Join-Path dependency-sources $sdist.filename
              Invoke-WebRequest -Uri $sdist.url -OutFile $dest
              $actual = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $sdist.digests.sha256.ToLowerInvariant()) {
                Remove-Item -Force $dest
                throw "PyPI SHA256 mismatch"
              }
            } catch {
              # Some projects (notably Frida) publish only native wheels.
              # Record this explicitly instead of silently claiming a source build.
              $missing += "$pin : $($_.Exception.Message)"
            }
          }
          $missing | Sort-Object -Unique | Out-File -Encoding ascii dependency-sources-unavailable.txt
          Get-ChildItem dependency-sources -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii dependency-sources-SHA256SUMS.txt

      - name: Build OpenSSL from pinned source
        shell: pwsh
        run: |
          $vsDevShell = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1"
          & $vsDevShell -Arch amd64 -HostArch amd64

          # cryptography's source build needs OpenSSL headers and libraries.
          # Build OpenSSL rather than installing a third-party precompiled SDK.
          git clone --depth 1 --branch openssl-3.6.0 `
            https://github.com/openssl/openssl.git openssl-src
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL clone failed" }
          $opensslCommit = (git -C openssl-src rev-parse HEAD).Trim()
          if ($opensslCommit -ne "7b371d80d959ec9ab4139d09d78e83c090de9779") {
            throw "Unexpected OpenSSL source commit: $opensslCommit"
          }

          Push-Location openssl-src
          perl Configure VC-WIN64A no-shared no-tests `
            --prefix="$env:GITHUB_WORKSPACE\openssl-local" `
            --openssldir="$env:GITHUB_WORKSPACE\openssl-local\ssl"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL configure failed" }
          nmake /S
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed" }
          nmake /S install_sw
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL install failed" }
          Pop-Location

      - name: Build native Python dependencies from source and install locked environment
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==25.3"
          $env:OPENSSL_DIR = "$env:GITHUB_WORKSPACE\openssl-local"
          $env:OPENSSL_STATIC = "1"

          # Frida is the sole allowed native-wheel exception selected for this
          # build. Every listed C/Rust extension is forced through its verified
          # sdist hash and compiled locally with MSVC/Rust.
          $sourcePackages = @(
            "brotli",
            "cffi",
            "cryptography",
            "psutil",
            "pydantic-core",
            "pylsqpack",
            "tgcrypto-pyrofork",
            "watchdog",
            "zstandard"
          )
          $noBinary = $sourcePackages -join ","
          python -m pip install --require-hashes `
            "--no-binary=$noBinary" `
            -r constraints/windows-amd64-py311.lock
          if ($LASTEXITCODE -ne 0) { throw "Source dependency build failed" }
          python -m pip check

          @(
            "Allowed native wheel: frida==17.17.0",
            "Source-built native packages:",
            ($sourcePackages | ForEach-Object { "  $_" })
          ) | Out-File -Encoding ascii SOURCE_BUILD_MANIFEST.txt

      - name: Install Nuitka from its hash-pinned source distribution
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-binary=Nuitka --no-deps `
            -r constraints/windows-amd64-build.lock
          python -m nuitka --version

      - name: Audit resolved Python environment
        shell: pwsh
        run: |
          # Install the auditor separately; it is not shipped in the artifact.
          python -m pip install "pip-audit==2.10.1"
          pip-audit --progress-spinner off
          python -m pip freeze --all | Sort-Object | Out-File -Encoding utf8 requirements-resolved.txt

      - name: Enable compile-time hardened policy
        shell: pwsh
        run: |
          @'
          """Generated by the hardened Windows build workflow."""
          HARDENED_BUILD = True
          '@ | Set-Content -Encoding utf8 friTap/build_policy.py

      - name: Smoke test source tree
        shell: pwsh
        run: |
          $env:FRITAP_ENABLE_EXTERNAL_EXTENSIONS = ""
          python -c "import platform, friTap; assert platform.machine().upper() in ('AMD64','X86_64'); print('friTap', friTap.__version__)"
          python -c "from friTap.discovery_base import external_extensions_disabled; assert external_extensions_disabled()"
          python friTap.py --help | Out-Null

      - name: Compile with Nuitka and MSVC
        shell: pwsh
        run: |
          # Nuitka compiles Python modules to C and then with the runner's MSVC.
          # --disable-ccache prevents Nuitka from downloading a ccache binary.
          python -m nuitka `
            --mode=standalone `
            --msvc=latest `
            --disable-ccache `
            --windows-console-mode=force `
            --output-dir=dist `
            --output-filename=fritap.exe `
            --include-package=friTap `
            --include-package-data=friTap `
            --nofollow-import-to=tkinter `
            friTap.py

      - name: Verify and package
        shell: pwsh
        run: |
          $out = "dist/friTap.dist"
          if (-not (Test-Path "$out/fritap.exe")) {
            # Nuitka output directory casing can follow the input module name.
            $candidate = Get-ChildItem dist -Directory -Filter "*.dist" | Select-Object -First 1
            if (-not $candidate) { throw "Nuitka standalone directory not found" }
            $out = $candidate.FullName
          }

          $forbidden = Get-ChildItem $out -Recurse -File |
            Where-Object { $_.Name -like "tcpdump_*_android" }
          if ($forbidden) { throw "Android tcpdump found in Windows artifact" }

          # Confirm that hardened extension loading is the compiled default.
          & "$out/fritap.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Compiled executable smoke test failed" }

          Copy-Item requirements-resolved.txt "$out/requirements-resolved.txt"
          Copy-Item SOURCE_BUILD_MANIFEST.txt "$out/SOURCE_BUILD_MANIFEST.txt"
          Copy-Item dependency-sources-unavailable.txt "$out/dependency-sources-unavailable.txt"
          Copy-Item dependency-sources-SHA256SUMS.txt "$out/dependency-sources-SHA256SUMS.txt"

          Get-ChildItem $out -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $out).Path.Length + 1)
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          } | Out-File -Encoding ascii "$out/SHA256SUMS.txt"

          Compress-Archive -Path "$out/*" -DestinationPath "fritap-windows-amd64-nuitka.zip" -Force
          Get-FileHash "fritap-windows-amd64-nuitka.zip" -Algorithm SHA256 | Format-List

      - name: Upload Windows artifact and source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fritap-windows-amd64-nuitka
          path: |
            fritap-windows-amd64-nuitka.zip
            requirements-resolved.txt
            SOURCE_BUILD_MANIFEST.txt
            dependency-sources-unavailable.txt
            dependency-sources-SHA256SUMS.txt
            dependency-sources/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
