name: Build Probe MCP Agent & Security Scans

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branche, Tag ou Commit à builder et scanner (ex: main, v0.6.0-rc327)"
        required: true
        default: "v0.6.0-rc327"

env:
  SOURCE_REPO: probelabs/probe
  PROBE_REF: ${{ github.event.inputs.target_ref }}
  RUST_VERSION: stable

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 : BUILD WINDOWS AMD64 (100% from source)
  # ───────────────────────────────────────────────────────────────────────────
  build-mcp-agent:
    name: "🏗️ Build Windows AMD64"
    runs-on: windows-latest

    steps:
      # actions/checkout gère directement branches, tags ET commits via "ref:".
      # Pas besoin de checkout manuel en 2 étapes.
      - name: Checkout du ref cible (tag/branche/commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          fetch-depth: 0

      - name: Verify Final Checkout State
        shell: bash
        run: |
          echo "✅ Verifying state after checkout..."
          echo "--- Git Describe (tag ou commit) ---"
          git describe --tags --exact-match 2>/dev/null || git describe --tags 2>/dev/null || git rev-parse --short HEAD
          echo "--- Version in root Cargo.toml ---"
          grep -m1 '^version' Cargo.toml

          # ⚠️ IMPORTANT : il n'existe PAS de feature Cargo "agent" dans ce projet
          # (ni sur v0.6.0-rc327, ni sur main). Les seules features Rust sont :
          #   default = []  et  bert-reranker = [...]   (reranker BERT optionnel)
          # Le "mode agent" + le serveur MCP vivent dans le package npm (Node.js) :
          #   npm/src/agent/*  ->  probe agent   (build/agent/index.js)
          #   npm/src/mcp/*    ->  probe mcp     (build/mcp/index.js)
          echo "--- Verifying REAL Cargo features ---"
          grep -A 8 '^\[features\]' Cargo.toml

          echo "--- Verifying npm Agent & MCP sources exist ---"
          test -f npm/src/agent/index.js && echo "✅ npm agent source OK (sera bundlé vers build/agent/index.js)"
          test -f npm/src/mcp/index.ts   && echo "✅ npm MCP source OK (sera compilé vers build/mcp/index.js)"
          test -f npm/bin/probe          && echo "✅ launcher npm/bin/probe OK (route 'mcp' et 'agent' vers Node, sinon probe.exe)"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # PAS de --all-features : cela activerait "bert-reranker" (candle-core/nn/
      # transformers + tokenizers + hf-hub) = +20/40 min de compilation Windows
      # pour une fonctionnalité optionnelle inutile avec Kilo Code.
      # PAS de binaire lsp-daemon non plus : sur ce tag, [[bin]] lsp-daemon est
      # COMMENTÉ dans lsp-daemon/Cargo.toml ("LSP functionality is now integrated
      # directly into the main probe binary" -> probe lsp start).
      - name: Build probe.exe (Rust, from source)
        shell: bash
        run: |
          cargo build --release --bin probe
          echo "=== Rust binary built from source ==="
          ls -la target/release/probe.exe

      # Build du package npm :
      #   npm install --ignore-scripts  -> installe deps SANS lancer le
      #     postinstall (scripts/postinstall.js) qui télécharge les binaires
      #     prébuildés (ce que tu ne veux pas).
      #   npm run build = build:types + build:cjs (esbuild) + build:mcp (tsc)
      #     + build:agent (esbuild). "npm run" met déjà node_modules/.bin dans
      #     le PATH -> tsc/esbuild sont trouvés. PAS besoin de "npm bin"
      #     (supprimé dans npm 11 / Node 24).
      - name: Install npm dependencies (skip binary downloader)
        working-directory: ./npm
        shell: bash
        run: npm install --ignore-scripts

      - name: Build Node CLI (CJS + MCP + Agent)
        working-directory: ./npm
        shell: bash
        run: |
          npm run build
          echo "=== Node build outputs ==="
          ls -la build/mcp/index.js build/agent/index.js
          ls -la cjs/

      # Le launcher npm/bin/probe cherche "bin/probe.exe" sur Windows :
      # on injecte NOTRE binaire compilé from source à cet endroit exact.
      - name: Inject Custom Rust Binary and Verify
        shell: bash
        run: |
          mkdir -p npm/bin
          cp -f target/release/probe.exe npm/bin/probe.exe
          echo "=== Binaries Injected ==="
          ls -la npm/bin/
          echo "--- Verifying final binary version ---"
          npm/bin/probe.exe --version
          echo "--- Verifying final binary commands ---"
          npm/bin/probe.exe --help

      # build/mcp/index.js est compilé par tsc (NON bundlé) : il importe à
      # l'exécution @modelcontextprotocol/sdk, zod, etc. depuis node_modules.
      # Le bundle agent garde aussi en "external": @modelcontextprotocol/sdk,
      # @ai-sdk/*, ai, fs-extra, tar, axios, dotenv.
      # -> le ZIP DOIT contenir node_modules (prod) sinon "probe mcp" / "probe agent"
      # planteront sur Windows avec "Cannot find package ...".
      # On prune les devDependencies (esbuild, typescript, jest...) avant packaging.
      - name: Prune dev dependencies
        working-directory: ./npm
        shell: bash
        run: npm prune --omit=dev

      - name: Prepare distribution package
        working-directory: ./npm
        shell: bash
        run: |
          mkdir -p dist-package/probe-mcp-agent
          cp -r build dist-package/probe-mcp-agent/
          cp -r bin dist-package/probe-mcp-agent/
          cp -r src dist-package/probe-mcp-agent/
          [ -d "cjs" ] && cp -r cjs dist-package/probe-mcp-agent/
          cp -r node_modules dist-package/probe-mcp-agent/
          cp package.json dist-package/probe-mcp-agent/
          [ -f "package-lock.json" ] && cp package-lock.json dist-package/probe-mcp-agent/
          [ -f "README.md" ] && cp README.md dist-package/probe-mcp-agent/
          [ -f "LICENSE" ] && cp LICENSE dist-package/probe-mcp-agent/
          [ -f ".env.example" ] && cp .env.example dist-package/probe-mcp-agent/
          cd dist-package/probe-mcp-agent
          # postinstall = téléchargeur de binaires ; prepare/prepack relancent des builds
          npm pkg delete scripts.postinstall scripts.prepare scripts.prepack
          cd ../..

      # tar (bsdtar, inclus dans Windows) est BEAUCOUP plus rapide que
      # Compress-Archive quand il y a un node_modules (milliers de fichiers).
      - name: Create ZIP artifact
        working-directory: ./npm
        shell: bash
        run: tar -a -c -f probe-mcp-agent-windows-amd64.zip -C dist-package probe-mcp-agent

      - name: Upload MCP Agent artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-windows-amd64-complete
          path: npm/probe-mcp-agent-windows-amd64.zip
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 : CLAMAV (Malware Scan)
  # ───────────────────────────────────────────────────────────────────────────
  clamav:
    name: "🦠 ClamAV – Malware Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - name: Install ClamAV & Scan
        run: |
          sudo apt-get update && sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "Freshclam failed, using default db."
          clamscan -r -i . > clamav-report.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.txt

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 : SEMGREP
  # ───────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔎 Semgrep – Patterns"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/secrets" --config "p/security-audit" --sarif --output semgrep.sarif . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 : GUARDDOG
  # ───────────────────────────────────────────────────────────────────────────
  guarddog:
    name: "🐕 GuardDog – Malicious Pkg"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GuardDog
        run: |
          pip install guarddog
          for f in $(find . -name "requirements*.txt" -not -path "*/node_modules/*" 2>/dev/null); do guarddog pypi verify "$f" --output-format json > "guarddog-pypi-$(basename "$f").json" 2>&1 || true; done
          for f in $(find . -name "package.json" -not -path "*/node_modules/*" 2>/dev/null); do guarddog npm verify "$f" --output-format json > "guarddog-npm-$(basename "$f").json" 2>&1 || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: guarddog-results
          path: guarddog-*.json
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 : CODEQL
  # NB: CodeQL ne supporte PAS Rust. Le repo est Rust + JS/TS (pas de Go/Python
  # significatif) -> matrice réduite à javascript-typescript.
  # ───────────────────────────────────────────────────────────────────────────
  codeql:
    name: "🧬 CodeQL – Analysis"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        language: [ 'javascript-typescript' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - name: Init & Analyze CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results-${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-report-${{ matrix.language }}
          path: codeql-results-${{ matrix.language }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6 : GITLEAKS & BEARER
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks-bearer:
    name: "🛡️ Gitleaks & Bearer"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
      - name: Run Bearer
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          bearer scan . --format sarif --output bearer.sarif --severity critical,high,medium --scanner secrets --quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: bearer-report
          path: bearer.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB FINAL : SUMMARY
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "📋 Security & Build Summary"
    runs-on: ubuntu-latest
    needs: [ build-mcp-agent, clamav, semgrep, guarddog, codeql, gitleaks-bearer ]
    if: always()
    steps:
      - name: Write Job Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🔒 Build & Security Report

          | Job | Statut |
          |-----|--------|
          | 🏗️ Build Windows AMD64   | ${{ needs.build-mcp-agent.result }} |
          | 🦠 ClamAV (Malware)      | ${{ needs.clamav.result }} |
          | 🔎 Semgrep               | ${{ needs.semgrep.result }} |
          | 🐕 GuardDog              | ${{ needs.guarddog.result }} |
          | 🧬 CodeQL                | ${{ needs.codeql.result }} |
          | 🛡️ Gitleaks & Bearer     | ${{ needs['gitleaks-bearer'].result }} |

          ℹ️ **Note:** Les rapports (.sarif, .json, .txt) et le ZIP du build sont téléchargeables dans la section "Artifacts" en bas de cette page.

          ### Utilisation du ZIP sur Windows (Kilo Code)
          1. Dézipper `probe-mcp-agent-windows-amd64.zip` (ex: `C:\Tools\probe-mcp-agent`)
          2. Node.js >= 18 requis (22/24 LTS recommandé)
          3. MCP stdio : `node C:\Tools\probe-mcp-agent\probe-mcp-agent\bin\probe mcp`
          4. Agent mode : `node C:\Tools\probe-mcp-agent\probe-mcp-agent\bin\probe agent`
          EOF
