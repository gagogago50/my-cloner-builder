name: Build Windows Binary & Security Scan (Probe)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche, tag ou SHA de probelabs/probe à builder'
        type: string
        default: 'main'
      version:
        description: 'Forcer une version (laisser vide pour auto-détection via git describe)'
        type: string
        default: ''
      create_release:
        description: 'Créer une release GitHub dans CE dépôt avec le binaire'
        type: boolean
        default: false

permissions:
  contents: write
  security-events: write
  actions: read

env:
  SOURCE_REPO: probelabs/probe
  RUST_VERSION: 1.92.0

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 : BUILD WINDOWS COMPLET (Rust + npm/MCP)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: "🏗️ Build Windows x86_64 (Full)"
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      git_hash: ${{ steps.build_info.outputs.git_hash }}
      build_date: ${{ steps.build_info.outputs.build_date }}
      asset: ${{ steps.package.outputs.asset }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - name: Checkout probe source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Vérification des prérequis (inspiré du build.bat)
      - name: Check Prerequisites
        id: prereq
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host "Probe Windows Build - Prerequisites Check"
          Write-Host "==========================================="
          
          # Check Rust
          Write-Host "[1/4] Checking Rust installation..."
          try {
            $rustVersion = rustc --version 2>&1
            Write-Host "  ✓ Rust installed: $rustVersion"
          } catch {
            Write-Error "✗ Rust not found. Install from https://rustup.rs/"
            exit 1
          }
          
          # Check Cargo
          try {
            $cargoVersion = cargo --version 2>&1
            Write-Host "  ✓ Cargo installed: $cargoVersion"
          } catch {
            Write-Error "✗ Cargo not found"
            exit 1
          }
          
          # Check Git (pour build.rs)
          Write-Host "[2/4] Checking Git..."
          try {
            $gitVersion = git --version 2>&1
            Write-Host "  ✓ Git installed"
          } catch {
            Write-Error "✗ Git not found"
            exit 1
          }
          
          # Check VS Build Tools
          Write-Host "[3/4] Checking Visual Studio Build Tools..."
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            Write-Host "  ✓ Visual Studio Installer found"
          } else {
            Write-Warning "  ⚠ vswhere.exe not found"
          }
          
          # Check Node.js (pour MCP)
          Write-Host "[4/4] Checking Node.js..."
          try {
            $nodeVersion = node --version 2>&1
            Write-Host "  ✓ Node.js installed: $nodeVersion"
          } catch {
            Write-Host "  ℹ Node.js will be installed next"
          }
          
          Write-Host "==========================================="
          Write-Host "All prerequisites satisfied"
          Write-Host "==========================================="

      # Installation Rust stable (auto-mise à jour)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # Node 22 pour builder le MCP et l'agent
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm/package.json

      # Affichage des versions
      - name: Show Toolchain Versions
        shell: bash
        run: |
          echo "=========================================="
          echo "Toolchain Versions"
          echo "=========================================="
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Git: $(git --version)"
          echo "=========================================="

      # Cache optimisé
      - name: Setup Rust Cache
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ env.RUST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-

      # Résolution de la version
      - name: Resolve Version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Git Hash: $(git rev-parse --short HEAD)"
          echo "Resolved Version: $VERSION"

      # Capture des métadonnées
      - name: Capture Build Info
        id: build_info
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "git_hash=$GIT_HASH" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      # Configuration Cargo pour Windows (optimisations release)
      - name: Setup Cargo Config
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-msvc]
          rustflags = [
            "-C", "target-feature=+crt-static",
            "-C", "link-args=/DEBUG:NONE",
            "-C", "link-args=/NOLOGO"
          ]
          EOF

      # BUILD RUST - Workspace complet (probe + lsp-daemon)
      - name: Build Rust Workspace Release
        id: rust_build
        timeout-minutes: 60
        shell: bash
        run: |
          echo "=========================================="
          echo "Building Rust Workspace (probe + lsp-daemon)"
          echo "=========================================="
          
          # Build tout le workspace (pas seulement le binaire principal)
          cargo build --release --target x86_64-pc-windows-msvc
          
          echo "=========================================="
          echo "Rust build completed"
          echo "=========================================="
          
          # Vérification des binaires produits
          ls -la target/x86_64-pc-windows-msvc/release/*.exe || true

      # Vérification post-build Rust
      - name: Verify Rust Binaries
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host "Verifying Rust Binaries"
          Write-Host "==========================================="
          
          $targetDir = "target/x86_64-pc-windows-msvc/release"
          
          # Binaires attendus
          $binaries = @("probe.exe", "lsp-daemon.exe", "debug-tree-sitter.exe", "position-analyzer.exe")
          
          foreach ($bin in $binaries) {
            $path = "$targetDir/$bin"
            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              $sizeMB = [math]::Round($size / 1MB, 2)
              Write-Host "  ✓ $bin ($sizeMB MB)"
            } else {
              Write-Host "  ⚠ $bin not found (optional)"
            }
          }
          
          # Test exécution probe
          $probePath = "$targetDir/probe.exe"
          if (Test-Path $probePath) {
            try {
              $output = & $probePath --help 2>&1 | Select-Object -First 5
              Write-Host "  ✓ probe.exe runs successfully"
            } catch {
              Write-Warning "  ⚠ probe.exe test run failed"
            }
          }
          
          Write-Host "==========================================="

      # Préparation npm - Copie des binaires dans npm/bin/
      - name: Prepare npm Binaries
        shell: bash
        run: |
          echo "Preparing npm binaries..."
          
          # Création du répertoire bin
          mkdir -p npm/bin
          
          # Copie des binaires principaux
          cp target/x86_64-pc-windows-msvc/release/probe.exe npm/bin/probe.exe
          cp target/x86_64-pc-windows-msvc/release/lsp-daemon.exe npm/bin/lsp-daemon.exe 2>/dev/null || echo "lsp-daemon.exe not found (may be built as lib)"
          
          # Copie des binaires optionnels
          cp target/x86_64-pc-windows-msvc/release/debug-tree-sitter.exe npm/bin/ 2>/dev/null || true
          cp target/x86_64-pc-windows-msvc/release/position-analyzer.exe npm/bin/ 2>/dev/null || true
          
          # Création du wrapper script (sans extension pour compatibilité)
          cat > npm/bin/probe << 'WRAPPER'
          #!/usr/bin/env node
          const { execFileSync } = require('child_process');
          const path = require('path');
          const os = require('os');
          
          const isWindows = os.platform() === 'win32';
          const binaryName = isWindows ? 'probe.exe' : 'probe';
          const binaryPath = path.join(__dirname, binaryName);
          
          try {
            execFileSync(binaryPath, process.argv.slice(2), { stdio: 'inherit' });
          } catch (e) {
            process.exit(e.status || 1);
          }
          WRAPPER
          
          # Liste des fichiers
          echo "npm/bin contents:"
          ls -la npm/bin/

      # ───── BUILD NPM COMPLET (MCP + Agent + CJS) ─────
      - name: Install npm Dependencies
        shell: bash
        run: |
          cd npm
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Audit npm Dependencies
        shell: bash
        run: |
          cd npm
          echo "Running npm audit..."
          npm audit --audit-level=high || echo "Audit completed with warnings"

      - name: Build CJS
        shell: bash
        run: |
          echo "Building CommonJS..."
          cd npm
          npm run build:cjs

      - name: Build MCP
        shell: bash
        run: |
          echo "Building MCP..."
          cd npm
          npm run build:mcp

      - name: Build Agent
        shell: bash
        run: |
          echo "Building Agent..."
          cd npm
          npm run build:agent

      - name: Verify npm Build Outputs
        shell: bash
        run: |
          echo "Verifying npm build outputs..."
          
          # Vérification des sorties attendues
          test -f npm/build/mcp/index.js || { echo "ERROR: MCP build output missing"; exit 1; }
          test -d npm/cjs || { echo "ERROR: CJS build output missing"; exit 1; }
          
          echo "npm build structure:"
          find npm/build -type f -name "*.js" | head -20
          find npm/cjs -type f | head -10

      # Packaging complet
      - name: Package Binary
        id: package
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          
          BINARY_NAME="probe"
          GIT_HASH="${{ steps.build_info.outputs.git_hash }}"
          BUILD_DATE="${{ steps.build_info.outputs.build_date }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          
          ARCHIVE_NAME="${BINARY_NAME}-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "$ARCHIVE_NAME"
          
          echo "=========================================="
          echo "Packaging $ARCHIVE_NAME"
          echo "=========================================="
          
          # Binaires Rust
          cp target/x86_64-pc-windows-msvc/release/probe.exe "$ARCHIVE_NAME/"
          cp target/x86_64-pc-windows-msvc/release/lsp-daemon.exe "$ARCHIVE_NAME/" 2>/dev/null || echo "Note: lsp-daemon.exe not included (may be optional)"
          
          # Binaires optionnels (debug tools)
          cp target/x86_64-pc-windows-msvc/release/debug-tree-sitter.exe "$ARCHIVE_NAME/" 2>/dev/null || true
          cp target/x86_64-pc-windows-msvc/release/position-analyzer.exe "$ARCHIVE_NAME/" 2>/dev/null || true
          
          # Package npm complet (pour usage MCP/Agent)
          mkdir -p "$ARCHIVE_NAME/npm"
          cp -r npm/src "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp -r npm/cjs "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp -r npm/build "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp npm/package.json "$ARCHIVE_NAME/npm/"
          cp npm/package-lock.json "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp npm/index.d.ts "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          
          # Wrapper et binaires dans le package npm
          mkdir -p "$ARCHIVE_NAME/npm/bin"
          cp npm/bin/probe.exe "$ARCHIVE_NAME/npm/bin/"
          cp npm/bin/lsp-daemon.exe "$ARCHIVE_NAME/npm/bin/" 2>/dev/null || true
          
          # Metadata
          cat > "$ARCHIVE_NAME/BUILD_INFO.txt" << EOF
          Probe Build Information
          =======================
          Version: ${VERSION}
          Git Hash: ${GIT_HASH}
          Build Date: ${BUILD_DATE}
          Target: x86_64-pc-windows-msvc
          Rust Version: ${{ env.RUST_VERSION }}
          Build Host: GitHub Actions (windows-latest)
          
          Binaries included:
          - probe.exe (main CLI)
          - lsp-daemon.exe (LSP pool manager for MCP)
          - debug-tree-sitter.exe (optional debug tool)
          - position-analyzer.exe (optional debug tool)
          
          npm package included for MCP/Agent support.
          EOF
          
          # Documentation
          cp README.md "$ARCHIVE_NAME/" 2>/dev/null || true
          cp LICENSE "$ARCHIVE_NAME/" 2>/dev/null || true
          cp ABOUT.MD "$ARCHIVE_NAME/" 2>/dev/null || true
          
          # Création ZIP
          powershell -Command "Compress-Archive -Path '${ARCHIVE_NAME}' -DestinationPath '${ARCHIVE_NAME}.zip' -Force"
          
          echo "ASSET=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          echo "asset=${ARCHIVE_NAME}.zip" >> "$GITHUB_OUTPUT"
          
          # Checksum
          certutil -hashfile "${ARCHIVE_NAME}.zip" SHA256 | grep -v "^SHA256" | grep -v "^CertUtil" | tr -d ' ' > "${ARCHIVE_NAME}.zip.sha256"
          echo "CHECKSUM=${ARCHIVE_NAME}.zip.sha256" >> "$GITHUB_ENV"
          echo "checksum=${ARCHIVE_NAME}.zip.sha256" >> "$GITHUB_OUTPUT"
          
          echo "=========================================="
          echo "Package created: ${ARCHIVE_NAME}.zip"
          echo "Size: $(du -h ${ARCHIVE_NAME}.zip | cut -f1)"
          echo "=========================================="

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-windows-x86_64
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
          body: |
            ## Probe Windows Build (Full MCP Support)
            
            **Version:** ${{ steps.resolve.outputs.version }}  
            **Git Hash:** ${{ steps.build_info.outputs.git_hash }}  
            **Build Date:** ${{ steps.build_info.outputs.build_date }}  
            **Target:** x86_64-pc-windows-msvc
            
            ### Binaries Included
            - `probe.exe` - Main CLI tool
            - `lsp-daemon.exe` - LSP server pool manager (required for MCP mode)
            - `debug-tree-sitter.exe` - Debug utility (optional)
            - `position-analyzer.exe` - Position analysis tool (optional)
            
            ### MCP Support
            The npm package is included in the `npm/` directory with full MCP and Agent support.
            
            ### Verification
            SHA256: `${{ steps.package.outputs.checksum }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOBS DE SÉCURITÉ (inchangés)
  # ───────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔎 Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: probelabs/probe
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config "p/default" --config "p/secrets" --config "p/rust" --sarif --output semgrep.sarif . || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  guarddog:
    name: "🐕 GuardDog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: probelabs/probe
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install guarddog
      - run: guarddog npm verify npm/package.json --output-format json > guarddog-npm.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarddog-results
          path: guarddog-*.json

  # ... (autres jobs de sécurité identiques)
