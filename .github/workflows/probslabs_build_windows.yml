name: Build Probe MCP Agent & Security Scans

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branche, Tag ou Commit à builder (ex: v0.6.0-rc327, main)"
        required: true
        default: "v0.6.0-rc327"

env:
  SOURCE_REPO: probelabs/probe
  PROBE_REF: ${{ github.event.inputs.target_ref }}
  RUST_VERSION: stable

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 : BUILD WINDOWS AMD64 (AGENT MCP + LSP)
  # ───────────────────────────────────────────────────────────────────────────
  build-mcp-agent:
    name: "🏗️ Build Windows AMD64"
    runs-on: windows-latest
    
    steps:
      - name: Checkout Probe repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          
      - name: Setup Node.js 24 (No Cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          
      - name: Install npm dependencies
        working-directory: ./npm
        env:
          PROBE_SKIP_DOWNLOAD: "true"
          SKIP_DOWNLOAD: "true"
        run: npm install --ignore-scripts
        
      - name: Build Node CLI, Agent & MCP
        working-directory: ./npm
        shell: bash
        run: |
          # 1. Build standard
          npm run build || true
          
          # 2. Exécution des scripts spécifiques que tu as identifiés
          echo "Building Agent..."
          [ -f "scripts/build-agent.cjs" ] && node scripts/build-agent.cjs
          
          echo "Building MCP..."
          [ -f "scripts/build-mcp.cjs" ] && node scripts/build-mcp.cjs
          
      - name: Build Probe binaries (Rust Workspace)
        shell: bash
        run: |
          # --workspace force la compilation de TOUS les projets Rust (incluant le lsp-daemon)
          cargo build --release --workspace --all-features --target x86_64-pc-windows-msvc
          echo "Rust binaries built from source."
          
      - name: Inject Custom Rust Binaries
        shell: bash
        run: |
          mkdir -p npm/bin
          # On copie TOUS les exécutables générés (probe.exe, lsp-daemon.exe, etc.)
          find target/x86_64-pc-windows-msvc/release -maxdepth 1 -name "*.exe" -exec cp {} npm/bin/ \;
          
          echo "=== Verified Binaries injected ==="
          ls -la npm/bin/
          # On affiche l'aide pour vérifier que les commandes sont bien là
          npm/bin/probe.exe --help || true
        
      - name: Prepare distribution package
        working-directory: ./npm
        shell: bash
        run: |
          mkdir -p dist-package/probe-mcp-agent
          if [ -d "build" ]; then cp -r build dist-package/probe-mcp-agent/; fi
          if [ -d "dist" ]; then cp -r dist dist-package/probe-mcp-agent/; fi
          if [ -d "bin" ]; then cp -r bin dist-package/probe-mcp-agent/; fi
          if [ -d "scripts" ]; then cp -r scripts dist-package/probe-mcp-agent/; fi
          
          cp package.json dist-package/probe-mcp-agent/
          [ -f "package-lock.json" ] && cp package-lock.json dist-package/probe-mcp-agent/
          [ -f "README.md" ] && cp README.md dist-package/probe-mcp-agent/
          [ -f "LICENSE" ] && cp LICENSE dist-package/probe-mcp-agent/
          [ -f ".env.example" ] && cp .env.example dist-package/probe-mcp-agent/
          
          # Nettoyage pour empêcher tout téléchargement futur par l'utilisateur
          cd dist-package/probe-mcp-agent
          npm pkg delete scripts.postinstall
          cd ../..
          
      - name: Create ZIP artifact
        working-directory: ./npm
        shell: pwsh
        run: Compress-Archive -Path dist-package/probe-mcp-agent -DestinationPath probe-mcp-agent-windows-amd64.zip -Force
          
      - name: Upload MCP Agent artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-windows-amd64-complete
          path: npm/probe-mcp-agent-windows-amd64.zip
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 : CLAMAV (Malware Scan)
  # ───────────────────────────────────────────────────────────────────────────
  clamav:
    name: "🦠 ClamAV – Malware Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - name: Install ClamAV & Scan
        run: |
          sudo apt-get update && sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || echo "Freshclam failed, using default db."
          clamscan -r -i . > clamav-report.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.txt

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 : SEMGREP
  # ───────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔎 Semgrep – Patterns"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/secrets" --config "p/security-audit" --sarif --output semgrep.sarif . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 : GUARDDOG
  # ───────────────────────────────────────────────────────────────────────────
  guarddog:
    name: "🐕 GuardDog – Malicious Pkg"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GuardDog
        run: |
          pip install guarddog
          for f in $(find . -name "requirements*.txt" -not -path "*/node_modules/*" 2>/dev/null); do guarddog pypi verify "$f" --output-format json > "guarddog-pypi-$(basename "$f").json" 2>&1 || true; done
          for f in $(find . -name "package.json" -not -path "*/node_modules/*" 2>/dev/null); do guarddog npm verify "$f" --output-format json > "guarddog-npm-$(basename "$f").json" 2>&1 || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: guarddog-results
          path: guarddog-*.json
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 : CODEQL
  # ───────────────────────────────────────────────────────────────────────────
  codeql:
    name: "🧬 CodeQL – Analysis"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        language: [ 'javascript-typescript', 'python', 'go' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '>=1.21'
      - name: Init & Analyze CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results-${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-report-${{ matrix.language }}
          path: codeql-results-${{ matrix.language }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6 : GITLEAKS & BEARER
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks-bearer:
    name: "🛡️ Gitleaks & Bearer"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.PROBE_REF }}
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore
      - name: Run Bearer
        run: |
          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          bearer scan . --format sarif --output bearer.sarif --severity critical,high,medium --scanner secrets --quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: bearer-report
          path: bearer.sarif
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # JOB FINAL : SUMMARY
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "📋 Security & Build Summary"
    runs-on: ubuntu-latest
    needs: [ build-mcp-agent, clamav, semgrep, guarddog, codeql, gitleaks-bearer ]
    if: always()
    steps:
      - name: Write Job Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🔒 Build & Security Report

          | Job | Statut |
          |-----|--------|
          | 🏗️ Build Windows AMD64   | ${{ needs.build-mcp-agent.result }} |
          | 🦠 ClamAV (Malware)      | ${{ needs.clamav.result }} |
          | 🔎 Semgrep               | ${{ needs.semgrep.result }} |
          | 🐕 GuardDog             | ${{ needs.guarddog.result }} |
          | 🧬 CodeQL               | ${{ needs.codeql.result }} |
          | 🛡️ Gitleaks & Bearer     | ${{ needs.gitleaks-bearer.result }} |
          
          ℹ️ **Note:** Les rapports (.sarif, .json, .txt) et le ZIP du build sont téléchargeables dans la section "Artifacts" en bas de cette page.
          EOF
