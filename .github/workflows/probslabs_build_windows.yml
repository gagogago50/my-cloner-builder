name: Build Probe MCP Agent (Windows AMD64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOURCE_REPO: probelabs/probe
  RUST_VERSION: stable

jobs:
  build-mcp-agent:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Probe repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          
      # 1. On installe d'abord les dépendances Node.js
      # On passe des variables d'environnement courantes pour tenter de bloquer le téléchargement
      - name: Install npm dependencies
        working-directory: ./npm
        env:
          PROBE_SKIP_DOWNLOAD: "true"
          SKIP_DOWNLOAD: "true"
        run: npm install
        
      # 2. On build le code TypeScript/Node.js (qui va créer le dossier build/cli.js)
      - name: Build Node CLI
        working-directory: ./npm
        run: npm run build
          
      # 3. ENSUITE, on build le binaire Rust avec TOUTES les features (--all-features)
      # Cela garantit que les sous-commandes 'agent', 'mcp', etc., sont bien incluses.
      - name: Build Probe binary (Rust AMD64)
        shell: bash
        run: |
          cargo build --release --all-features --target x86_64-pc-windows-msvc
          echo "Rust binary built."
          
      # 4. On FORCE la copie du binaire Rust fraîchement compilé dans le dossier npm
      # En le faisant à la fin, on écrase l'éventuel vieux binaire téléchargé par 'npm install'
      - name: Inject Custom Rust Binary
        shell: bash
        run: |
          mkdir -p npm/bin
          cp -f target/x86_64-pc-windows-msvc/release/probe.exe npm/bin/probe.exe
          echo "=== Verified Probe Binary injected ==="
          ls -la npm/bin/
          # Optionnel : vérifier que la sous-commande agent existe
          npm/bin/probe.exe --help
        
      # 5. On prépare le dossier final avec TOUT ce qui est nécessaire
      - name: Prepare distribution package
        working-directory: ./npm
        shell: bash
        run: |
          mkdir -p dist-package/probe-mcp-agent
          
          # On copie le dossier build (qui contient cli.js d'après ta config kilocode)
          if [ -d "build" ]; then
            cp -r build dist-package/probe-mcp-agent/
            echo "Copied build/ folder"
          fi
          
          # On copie dist si existant
          if [ -d "dist" ]; then
            cp -r dist dist-package/probe-mcp-agent/
            echo "Copied dist/ folder"
          fi
          
          # On copie le dossier bin avec NOTRE probe.exe
          if [ -d "bin" ]; then
            cp -r bin dist-package/probe-mcp-agent/
            echo "Copied bin/ folder"
          fi
          
          # Fichiers essentiels
          cp package.json dist-package/probe-mcp-agent/
          [ -f "package-lock.json" ] && cp package-lock.json dist-package/probe-mcp-agent/
          [ -f "README.md" ] && cp README.md dist-package/probe-mcp-agent/
          [ -f "LICENSE" ] && cp LICENSE dist-package/probe-mcp-agent/
          [ -f ".env.example" ] && cp .env.example dist-package/probe-mcp-agent/
          
          echo "=== Distribution package contents ==="
          find dist-package/probe-mcp-agent -type f | head -50
          
      # 6. Création de l'archive finale
      - name: Create ZIP artifact
        working-directory: ./npm
        shell: pwsh
        run: |
          Compress-Archive -Path dist-package/probe-mcp-agent -DestinationPath probe-mcp-agent-windows-amd64.zip -Force
          Write-Host "=== ZIP created ==="
          Get-Item probe-mcp-agent-windows-amd64.zip
          
      - name: Upload MCP Agent artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-windows-amd64-complete
          path: npm/probe-mcp-agent-windows-amd64.zip
          retention-days: 30
          if-no-files-found: error
