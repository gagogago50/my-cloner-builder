name: Build Windows Binary & Security Scan (Probe)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche, tag ou SHA de probelabs/probe à builder'
        type: string
        default: 'main'
      version:
        description: 'Forcer une version (laisser vide pour auto-détection via git describe)'
        type: string
        default: ''
      create_release:
        description: 'Créer une release GitHub dans CE dépôt avec le binaire'
        type: boolean
        default: false

permissions:
  contents: write
  security-events: write
  actions: read

env:
  SOURCE_REPO: probelabs/probe
  RUST_VERSION: "stable"  # ← Utiliser stable pour éviter les problèmes de version

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 : BUILD WINDOWS COMPLET (Rust + npm/MCP/Agent)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: "🏗️ Build Windows x86_64 (Full MCP)"
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      git_hash: ${{ steps.build_info.outputs.git_hash }}
      build_date: ${{ steps.build_info.outputs.build_date }}
      asset: ${{ steps.package.outputs.asset }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - name: Checkout probe source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Vérification des prérequis
      - name: Check Prerequisites
        id: prereq
        shell: pwsh
        run: |
          Write-Host "==========================================="
          Write-Host "Probe Windows Build - Prerequisites Check"
          Write-Host "==========================================="
          
          # Check Rust
          Write-Host "[1/3] Checking Rust..."
          try {
            $rustVersion = rustc --version 2>&1
            Write-Host "  ✓ Rust: $rustVersion"
          } catch {
            Write-Error "✗ Rust not found"
            exit 1
          }
          
          # Check Node.js
          Write-Host "[2/3] Checking Node.js..."
          try {
            $nodeVersion = node --version 2>&1
            Write-Host "  ✓ Node.js: $nodeVersion"
          } catch {
            Write-Host "  ℹ Node.js will be installed"
          }
          
          # Check VS Build Tools
          Write-Host "[3/3] Checking VS Build Tools..."
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            Write-Host "  ✓ Visual Studio found"
          } else {
            Write-Warning "  ⚠ VS Build Tools may be needed"
          }
          
          Write-Host "==========================================="

      # Installation Rust stable
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # Node 22 pour npm build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm/package.json

      # Affichage des versions
      - name: Show Versions
        shell: bash
        run: |
          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

      # Cache Rust
      - name: Setup Rust Cache
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml') || 'stable' }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      # Résolution version
      - name: Resolve Version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Capture métadonnées
      - name: Capture Build Info
        id: build_info
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "git_hash=$GIT_HASH" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      # Configuration Cargo Windows
      - name: Setup Cargo Config
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-msvc]
          rustflags = [
            "-C", "target-feature=+crt-static",
            "-C", "link-args=/DEBUG:NONE",
            "-C", "link-args=/NOLOGO"
          ]
          EOF

      # BUILD RUST - Workspace complet
      - name: Build Rust Workspace
        id: rust_build
        timeout-minutes: 60
        shell: bash
        run: |
          echo "=========================================="
          echo "Building Rust Workspace"
          echo "=========================================="
          
          # Build tout le workspace (probe + lsp-daemon + autres)
          cargo build --release --target x86_64-pc-windows-msvc
          
          echo "Built binaries:"
          ls -la target/x86_64-pc-windows-msvc/release/*.exe || true

      # Vérification binaires Rust
      - name: Verify Rust Binaries
        shell: pwsh
        run: |
          $targetDir = "target/x86_64-pc-windows-msvc/release"
          
          $mainBinary = "$targetDir/probe.exe"
          if (Test-Path $mainBinary) {
            $size = (Get-Item $mainBinary).Length / 1MB
            Write-Host "✓ probe.exe ($([math]::Round($size,2)) MB)"
            
            # Test exécution
            & $mainBinary --version
          } else {
            Write-Error "✗ probe.exe not found!"
            exit 1
          }
          
          # Vérifier lsp-daemon (optionnel mais recommandé)
          $lspDaemon = "$targetDir/lsp-daemon.exe"
          if (Test-Path $lspDaemon) {
            Write-Host "✓ lsp-daemon.exe found"
          } else {
            Write-Warning "⚠ lsp-daemon.exe not found (may be built as lib)"
          }

      # ───── PRÉPARATION NPM (copie des binaires) ─────
      - name: Prepare npm Binaries
        shell: bash
        run: |
          echo "Preparing npm binaries..."
          
          mkdir -p npm/bin
          
          # Copie des binaires pour le package npm
          cp target/x86_64-pc-windows-msvc/release/probe.exe npm/bin/probe.exe
          cp target/x86_64-pc-windows-msvc/release/lsp-daemon.exe npm/bin/ 2>/dev/null || true
          
          echo "npm/bin contents:"
          ls -la npm/bin/

      # ───── BUILD NPM COMPLET (CJS + MCP + Agent) ─────
      - name: Install npm Dependencies
        shell: bash
        run: |
          cd npm
          # Vérifier si package-lock.json existe
          if [ -f package-lock.json ]; then
            echo "Using npm ci (lockfile exists)"
            npm ci --ignore-scripts
          else
            echo "Using npm install (no lockfile)"
            npm install --ignore-scripts
          fi

      - name: Build npm (CJS)
        shell: bash
        run: |
          echo "Building CJS..."
          cd npm
          npm run build:cjs

      - name: Build npm (MCP)
        shell: bash
        run: |
          echo "Building MCP..."
          cd npm
          npm run build:mcp

      - name: Build npm (Agent)
        shell: bash
        run: |
          echo "Building Agent..."
          cd npm
          npm run build:agent

      - name: Verify npm Build
        shell: bash
        run: |
          echo "Verifying npm build..."
          
          # Vérifier les sorties
          test -f npm/build/mcp/index.js || { echo "ERROR: MCP build missing"; exit 1; }
          test -d npm/cjs || { echo "ERROR: CJS build missing"; exit 1; }
          
          echo "✓ npm build verified"
          echo "MCP files:"
          find npm/build -name "*.js" | head -5
          echo "CJS files:"
          find npm/cjs -name "*.js" | head -5

      # Packaging complet
      - name: Package Binary
        id: package
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          
          VERSION="${{ steps.resolve.outputs.version }}"
          GIT_HASH="${{ steps.build_info.outputs.git_hash }}"
          BUILD_DATE="${{ steps.build_info.outputs.build_date }}"
          
          ARCHIVE_NAME="probe-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "$ARCHIVE_NAME"
          
          echo "=========================================="
          echo "Packaging $ARCHIVE_NAME"
          echo "=========================================="
          
          # ─── BINAIRES RUST ───
          cp target/x86_64-pc-windows-msvc/release/probe.exe "$ARCHIVE_NAME/"
          cp target/x86_64-pc-windows-msvc/release/lsp-daemon.exe "$ARCHIVE_NAME/" 2>/dev/null || true
          
          # ─── PACKAGE NPM (MCP + Agent) ───
          mkdir -p "$ARCHIVE_NAME/npm"
          cp -r npm/src "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp -r npm/cjs "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp -r npm/build "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp npm/package.json "$ARCHIVE_NAME/npm/"
          cp npm/package-lock.json "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          cp npm/index.d.ts "$ARCHIVE_NAME/npm/" 2>/dev/null || true
          
          # Binaires dans npm/bin
          mkdir -p "$ARCHIVE_NAME/npm/bin"
          cp npm/bin/probe.exe "$ARCHIVE_NAME/npm/bin/"
          cp npm/bin/lsp-daemon.exe "$ARCHIVE_NAME/npm/bin/" 2>/dev/null || true
          
          # Wrapper npm (pour usage: npx probe ...)
          cat > "$ARCHIVE_NAME/npm/bin/probe" << 'EOF'
          #!/usr/bin/env node
          const { execFileSync } = require('child_process');
          const path = require('path');
          const os = require('os');
          
          const isWindows = os.platform() === 'win32';
          const binaryName = isWindows ? 'probe.exe' : 'probe';
          const binaryPath = path.join(__dirname, binaryName);
          
          try {
            execFileSync(binaryPath, process.argv.slice(2), { stdio: 'inherit' });
          } catch (e) {
            process.exit(e.status || 1);
          }
          EOF
          
          # ─── MÉTADONNÉES ───
          cat > "$ARCHIVE_NAME/BUILD_INFO.txt" << EOF
          Probe Windows Build
          ===================
          Version: ${VERSION}
          Git Hash: ${GIT_HASH}
          Build Date: ${BUILD_DATE}
          Target: x86_64-pc-windows-msvc
          
          CONTENU:
          --------
          - probe.exe: Binaire principal (CLI Rust)
          - lsp-daemon.exe: Daemon LSP (gestion des serveurs de langage)
          - npm/: Package Node.js complet avec MCP et Agent
          
          UTILISATION MCP:
          ----------------
          Le mode MCP nécessite Node.js. Pour l'utiliser:
          
          1. Installer les dépendances npm:
             cd npm && npm install
          
          2. Lancer le serveur MCP:
             npm run mcp
             # ou
             node build/mcp/index.js
          
          3. Configurer Claude Desktop / Cline:
             {
               "mcpServers": {
                 "probe": {
                   "command": "node",
                   "args": ["C:\\\\chemin\\\\vers\\\\probe-${VERSION}\\\\npm\\\\build\\\\mcp\\\\index.js"]
                 }
               }
             }
          
          COMMANDES DISPONIBLES:
          ----------------------
          - probe.exe search: Recherche sémantique de code
          - probe.exe extract: Extraction de blocs de code
          - probe.exe symbols: Liste des symboles
          - probe.exe query: Requêtes AST
          - probe.exe lsp: Gestion du daemon LSP
          EOF
          
          # ─── DOCUMENTATION ───
          cp README.md "$ARCHIVE_NAME/" 2>/dev/null || true
          cp LICENSE "$ARCHIVE_NAME/" 2>/dev/null || true
          
          # ─── ARCHIVE ZIP ───
          powershell -Command "Compress-Archive -Path '${ARCHIVE_NAME}' -DestinationPath '${ARCHIVE_NAME}.zip' -Force"
          
          echo "ASSET=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          echo "asset=${ARCHIVE_NAME}.zip" >> "$GITHUB_OUTPUT"
          
          # Checksum
          certutil -hashfile "${ARCHIVE_NAME}.zip" SHA256 | grep -v "^SHA256" | grep -v "^CertUtil" | tr -d ' ' > "${ARCHIVE_NAME}.zip.sha256"
          echo "CHECKSUM=${ARCHIVE_NAME}.zip.sha256" >> "$GITHUB_ENV"
          echo "checksum=${ARCHIVE_NAME}.zip.sha256" >> "$GITHUB_OUTPUT"
          
          echo "=========================================="
          echo "Package created: ${ARCHIVE_NAME}.zip"
          du -sh "${ARCHIVE_NAME}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-windows-x86_64
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
          body: |
            ## Probe Windows Build (avec MCP et Agent)
            
            **Version:** ${{ steps.resolve.outputs.version }}  
            **Git Hash:** ${{ steps.build_info.outputs.git_hash }}  
            **Build Date:** ${{ steps.build_info.outputs.build_date }}
            
            ### 📦 Contenu
            - `probe.exe` - Binaire principal (recherche, extraction, LSP)
            - `lsp-daemon.exe` - Gestionnaire de pools LSP
            - `npm/` - Package Node.js complet avec serveur MCP et Agent
            
            ### 🚀 Utilisation MCP
            
            Le binaire `probe.exe` **ne contient pas** de commande `mcp` - c'est normal !
            
            Le serveur MCP est dans le dossier `npm/` :
            ```bash
            cd npm
            npm install
            node build/mcp/index.js
            ```
            
            ### Configuration Claude Desktop
            ```json
            {
              "mcpServers": {
                "probe": {
                  "command": "node",
                  "args": ["C:\\chemin\\vers\\probe-${{ steps.resolve.outputs.version }}\\npm\\build\\mcp\\index.js"]
                }
              }
            }
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOBS DE SÉCURITÉ (inchangés)
  # ───────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔎 Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: probelabs/probe
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config "p/default" --config "p/secrets" --config "p/rust" --sarif --output semgrep.sarif . || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
