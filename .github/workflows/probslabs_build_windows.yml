name: Build Probe MCP Agent (Windows AMD64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOURCE_REPO: probelabs/probe
  RUST_VERSION: stable

jobs:
  build-mcp-agent:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Probe repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          
      # CORRECTION : Passage à Node 24 et retrait du cache qui faisait planter l'étape
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # J'ai retiré cache: 'npm' et cache-dependency-path 
          # car le fichier package-lock.json est introuvable au démarrage
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          
      - name: Build Probe binary (AMD64)
        shell: bash
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          mkdir -p npm/bin
          cp target/x86_64-pc-windows-msvc/release/probe.exe npm/bin/probe.exe
          echo "Probe binary built:"
          ls -la npm/bin/
          
      - name: Install npm dependencies
        working-directory: ./npm
        run: npm install
        
      - name: Build MCP Agent
        working-directory: ./npm
        run: npm run build
        
      - name: Prepare distribution package
        working-directory: ./npm
        shell: bash
        run: |
          mkdir -p dist-package/probe-mcp-agent
          
          if [ -d "dist" ]; then
            cp -r dist dist-package/probe-mcp-agent/
          elif [ -d "build" ]; then
            cp -r build dist-package/probe-mcp-agent/
          else
            echo "Warning: No dist or build folder found"
          fi
          
          if [ -d "bin" ]; then
            cp -r bin dist-package/probe-mcp-agent/
          fi
          
          cp package.json dist-package/probe-mcp-agent/
          [ -f "package-lock.json" ] && cp package-lock.json dist-package/probe-mcp-agent/
          [ -f "README.md" ] && cp README.md dist-package/probe-mcp-agent/
          [ -f "LICENSE" ] && cp LICENSE dist-package/probe-mcp-agent/
          [ -d "src" ] && cp -r src dist-package/probe-mcp-agent/
          [ -f ".env.example" ] && cp .env.example dist-package/probe-mcp-agent/
          [ -f "tsconfig.json" ] && cp tsconfig.json dist-package/probe-mcp-agent/
          
          echo "=== Distribution package contents ==="
          find dist-package -type f | head -50
          
      - name: Create ZIP artifact
        working-directory: ./npm
        shell: pwsh
        run: |
          Compress-Archive -Path dist-package/probe-mcp-agent -DestinationPath probe-mcp-agent-windows-amd64.zip
          Write-Host "=== ZIP created ==="
          Get-Item probe-mcp-agent-windows-amd64.zip
          
      - name: Upload MCP Agent artifact (files)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-files
          path: |
            npm/dist/
            npm/bin/
            npm/package.json
            npm/README.md
          retention-days: 30
          if-no-files-found: warn
          
      - name: Upload MCP Agent artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-windows-amd64-complete
          path: npm/probe-mcp-agent-windows-amd64.zip
          retention-days: 30
          if-no-files-found: error
          
      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: npm/probe-mcp-agent-windows-amd64.zip
          name: Probe MCP Agent ${{ github.ref_name }} (Windows AMD64)
          body: |
            Build complet du Probe MCP Agent pour Windows (Architecture AMD64 / x86_64) pour kilocode cli.
            
            Contenu:
            - Binaire probe.exe (Rust compilé pour x86_64-pc-windows-msvc)
            - MCP Agent (Node.js build)
            - Fichiers de configuration
            
            Installation:
            1. Dézipper probe-mcp-agent-windows-amd64.zip
            2. cd probe-mcp-agent
            3. npm install --production
            4. node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
