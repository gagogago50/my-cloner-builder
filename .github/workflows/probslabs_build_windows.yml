name: Build Probe MCP Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOURCE_REPO: probelabs/probe
  RUST_VERSION: stable

jobs:
  build-mcp-agent:
    runs-on: windows-latest
    
    steps:
      # Checkout du repository Probe
      - name: Checkout Probe repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: npm/package-lock.json
          
      # Setup Rust (CORRIGÉ)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          
      # Build le binaire Rust probe
      - name: Build Probe binary
        shell: bash
        run: |
          cargo build --release
          mkdir -p npm/bin
          cp target/release/probe.exe npm/bin/probe.exe
          echo "Probe binary built:"
          ls -la npm/bin/
          
      # Installer les dépendances npm
      - name: Install npm dependencies
        working-directory: ./npm
        run: npm install
        
      # Build le MCP agent
      - name: Build MCP Agent
        working-directory: ./npm
        run: npm run build
        
      # Créer la structure complète pour distribution
      - name: Prepare distribution package
        working-directory: ./npm
        shell: bash
        run: |
          # Créer le dossier de distribution
          mkdir -p dist-package/probe-mcp-agent
          
          # Copier les fichiers buildés (dist ou build)
          if [ -d "dist" ]; then
            cp -r dist/* dist-package/probe-mcp-agent/
            echo "Copied dist/ files"
          elif [ -d "build" ]; then
            cp -r build/* dist-package/probe-mcp-agent/
            echo "Copied build/ files"
          else
            echo "Warning: No dist or build folder found"
            ls -la
          fi
          
          # Copier le binaire probe
          if [ -d "bin" ]; then
            cp -r bin dist-package/probe-mcp-agent/
            echo "Copied bin/ folder"
          fi
          
          # Copier les fichiers essentiels
          cp package.json dist-package/probe-mcp-agent/
          [ -f "package-lock.json" ] && cp package-lock.json dist-package/probe-mcp-agent/
          [ -f "README.md" ] && cp README.md dist-package/probe-mcp-agent/
          [ -f "LICENSE" ] && cp LICENSE dist-package/probe-mcp-agent/
          
          # Copier les sources (optionnel)
          [ -d "src" ] && cp -r src dist-package/probe-mcp-agent/
          
          # Copier les fichiers de config
          [ -f ".env.example" ] && cp .env.example dist-package/probe-mcp-agent/
          [ -f "tsconfig.json" ] && cp tsconfig.json dist-package/probe-mcp-agent/
          
          # Lister le contenu
          echo "=== Distribution package contents ==="
          find dist-package -type f | head -50
          
      # Créer le zip
      - name: Create ZIP artifact
        working-directory: ./npm
        shell: bash
        run: |
          cd dist-package
          zip -r ../probe-mcp-agent-windows.zip probe-mcp-agent/
          cd ..
          echo "=== ZIP created ==="
          ls -la probe-mcp-agent-windows.zip
          
      # Upload artifact (fichiers individuels)
      - name: Upload MCP Agent artifact (files)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-files
          path: |
            npm/dist/**/*
            npm/bin/**/*
            npm/package.json
            npm/README.md
          retention-days: 30
          if-no-files-found: warn
          
      # Upload artifact (ZIP complet)
      - name: Upload MCP Agent artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-windows-complete
          path: npm/probe-mcp-agent-windows.zip
          retention-days: 30
          if-no-files-found: error
          
      # Optionnel: Créer une release si c'est un tag
      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: npm/probe-mcp-agent-windows.zip
          name: Probe MCP Agent ${{ github.ref_name }} (Windows)
          body: |
            Build complet du Probe MCP Agent pour Windows
            
            Contenu:
            - Binaire probe.exe (Rust)
            - MCP Agent (Node.js build)
            - Fichiers de configuration
            
            Installation:
            1. Dézipper probe-mcp-agent-windows.zip
            2. cd probe-mcp-agent
            3. npm install --production
            4. node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
