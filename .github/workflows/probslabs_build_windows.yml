name: Build Probe MCP Agent (Windows AMD64)

on:
  workflow_dispatch:

env:
  SOURCE_REPO: probelabs/probe
  RUST_VERSION: stable

jobs:
  build-mcp-agent:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Probe repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          
      # 1. On installe les dépendances Node.js SANS exécuter les scripts (notamment postinstall)
      # L'option '--ignore-scripts' est la clé pour empêcher le téléchargement du binaire pré-compilé.
      - name: Install npm dependencies (without scripts)
        working-directory: ./npm
        run: npm install --ignore-scripts
        
      # 2. On build le code TypeScript/Node.js (qui va créer le dossier build/cli.js)
      - name: Build Node CLI
        working-directory: ./npm
        run: npm run build
          
      # 3. ENSUITE, on build le binaire Rust avec TOUTES les features (--all-features)
      # C'est cette étape qui crée le binaire que nous voulons, avec les sous-commandes 'agent', 'mcp', etc.
      - name: Build Probe binary (Rust AMD64)
        shell: bash
        run: |
          cargo build --release --all-features --target x86_64-pc-windows-msvc
          echo "Rust binary with all features built."
          
      # 4. On injecte notre binaire Rust fraîchement compilé dans le dossier npm/bin
      # Comme '--ignore-scripts' a été utilisé, le dossier 'npm/bin' est soit vide, soit n'existe pas.
      # Cette étape est donc cruciale pour placer notre binaire au bon endroit.
      - name: Inject Custom Rust Binary
        shell: bash
        run: |
          mkdir -p npm/bin
          cp -f target/x86_64-pc-windows-msvc/release/probe.exe npm/bin/probe.exe
          echo "=== Custom-built Probe Binary Injected ==="
          ls -la npm/bin/
          
          # Vérification cruciale : on s'assure que notre binaire reconnaît bien la sous-commande 'agent'
          echo "Verifying subcommands in the new binary:"
          npm/bin/probe.exe --help
        
      # 5. On prépare le dossier final avec TOUT ce qui est nécessaire
      - name: Prepare distribution package
        working-directory: ./npm
        shell: bash
        run: |
          mkdir -p dist-package/probe-mcp-agent
          
          # Copie des assets Node.js (le wrapper)
          cp -r build dist-package/probe-mcp-agent/
          
          # Copie du binaire que NOUS avons compilé
          cp -r bin dist-package/probe-mcp-agent/
          
          # Fichiers essentiels pour l'exécution et l'information
          cp package.json dist-package/probe-mcp-agent/
          [ -f "package-lock.json" ] && cp package-lock.json dist-package/probe-mcp-agent/
          [ -f "README.md" ] && cp README.md dist-package/probe-mcp-agent/
          [ -f "LICENSE" ] && cp LICENSE dist-package/probe-mcp-agent/
          
          echo "=== Distribution package contents preview ==="
          find dist-package/probe-mcp-agent -type f | head -50
          
      # 6. Création de l'archive finale
      - name: Create ZIP artifact
        working-directory: ./npm
        shell: pwsh
        run: |
          Compress-Archive -Path dist-package/probe-mcp-agent -DestinationPath probe-mcp-agent-windows-amd64.zip -Force
          Write-Host "=== ZIP created ==="
          Get-Item probe-mcp-agent-windows-amd64.zip
          
      - name: Upload MCP Agent artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: probe-mcp-agent-windows-amd64-complete
          path: npm/probe-mcp-agent-windows-amd64.zip
          retention-days: 30
          if-no-files-found: error
